<style>
:root{
  --bg:#F4F6F9;--surface:#FFF;--surface2:#F8FAFC;--line:#E4E9F0;--line2:#D2DAE4;
  --ink:#152433;--muted:#5E6E7E;--navy:#12243A;--navy2:#1B3554;--blue:#2A5889;

}
[dir=rtl]{--font:Dubai,'IBM Plex Sans Arabic',Inter,system-ui,'Segoe UI',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font)}
a{color:var(--blue)}
a,pre,td,th{overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button,summary{cursor:pointer}
:focus-visible{outline:3px solid #507CA9;outline-offset:3px}
svg{flex:none}
.appbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar-in,.hero-in,.page,.footer-in{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--pad)}
.appbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;line-height:1.3;text-decoration:none}
.brand b,.brand small{display:block}
.brand b{font-size:15px;color:var(--navy)}
.brand small{font-size:12.5px;color:var(--muted)}
.mark{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(145deg,var(--navy2),var(--navy));box-shadow:0 4px 12px rgba(18,36,58,.22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--navy);font-weight:600;font-size:14px;text-align:center;text-decoration:none}
.btn:hover{background:var(--surface2);border-color:var(--blue)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2)}
.btn:disabled{opacity:.6;cursor:wait}
#langBtn{flex:none;min-height:40px}
.hero{position:relative;color:#fff;background:radial-gradient(900px 300px at 85% -10%,rgba(58,110,165,.55),transparent 60%),linear-gradient(120deg,#0E1D30,#12243A 45%,#1B3554)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px);pointer-events:none}
.hero-in{position:relative;z-index:1;padding-block:32px 67px}
.eyebrow{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:#BFD3EA;margin:0 0 8px}
.eyebrow::before{content:"";width:22px;height:2px;flex:none;background:#7FA6D1;align-self:center}
.hero h1{margin:0 0 8px;font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.2}
.hero p:last-child{margin:0;color:#D6E2F0}
.page{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,315px);gap:20px;align-items:start;margin-block:-38px 0;padding-bottom:30px}
main,aside,.f{min-width:0}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:24px;margin-bottom:16px}
.panel{padding:18px;margin-bottom:14px}
.card h2,.picker summary{font-size:19px;font-weight:700;color:var(--navy);margin:0 0 14px}
.panel h2,.fields h3{font-size:14px;font-weight:700;color:var(--blue);margin:0 0 10px}
.picker summary{list-style:none;display:flex;align-items:center;gap:12px;margin:0}
.picker summary::-webkit-details-marker{display:none}
.picker summary::after{content:"";flex:none;width:8px;height:8px;border:solid var(--blue);border-width:0 2px 2px 0;transform:rotate(45deg);margin-inline-start:auto;margin-block-start:-4px}
.picker[open] summary::after{transform:rotate(225deg);margin-block-start:4px}
.picker .selected{font-size:14px;color:var(--muted);font-weight:600}
.picker[open] .selected{display:none}
#picker,#howTo,#top{scroll-margin-block-start:92px}
#howTo summary{font-size:19px;font-weight:700;color:var(--navy)}
#howTo ol{padding-inline-start:22px;margin-block:12px}
#howTo ol>li{padding-block:8px}
#howTo ol>li+li{border-top:1px solid var(--line)}
#howTo h3{font-size:15px;margin:0 0 4px;color:var(--navy)}
#howTo p{margin:0 0 8px}
#howTo .guide-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
#howTo .guide-example{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,40%);gap:6px 16px;align-items:start}
#howTo .guide-figure{display:block;padding:0;border:0;background:none;color:var(--blue);text-align:start;cursor:zoom-in;max-width:100%}
#howTo .guide-figure img{display:block;max-width:100%;max-height:158px;height:auto;border:1px solid var(--line2);border-radius:8px}
#howTo .guide-figure span{display:block;font-size:12px;text-decoration:underline;margin-block-start:4px}
#guideDialog{max-width:min(960px,calc(100% - 20px));box-sizing:border-box;width:100%;border:1px solid var(--line2);border-radius:14px;color:var(--navy);padding:14px}
#guideDialog::backdrop{background:#111d2f99}
#guideDialog .zoom{overflow:auto;max-height:64vh;margin-block-end:10px;direction:ltr}
#guideDialog img{display:block;max-width:none}
@media (max-width:560px){
  #howTo .guide-example{grid-template-columns:minmax(0,1fr)}
  #howTo .guide-figure img{max-height:116px}
}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.choice{position:relative;min-width:0}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tile{display:flex;flex-direction:column;gap:4px;height:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff;color:var(--navy);font-size:14.5px}
.tile small{color:var(--muted);font-size:13px;line-height:1.45}
.choice:hover .tile{border-color:#A9BCD3}
.choice input:checked+.tile{border-color:var(--navy);background:var(--blue-soft);box-shadow:0 0 0 2px rgba(18,36,58,.10)}
.choice input:focus-visible+.tile{outline:3px solid #507CA9;outline-offset:2px}
.fields+.fields{margin-top:20px}
.fields h3{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fields h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.full{grid-column:1/-1}
.f label{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:var(--navy)}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line2);border-radius:12px;background:white;font-size:16px}
.f textarea{min-height:120px;resize:vertical}
.f [dir=ltr]{text-align:start}
.f [aria-invalid=true]{border-color:var(--red);background:var(--red-soft)}
.req,.err{color:var(--red)}
.help,.opt,.err{font-size:13px;margin:4px 0 0}
.help,.opt{color:var(--muted);font-weight:400}
.help:empty,.err:empty{display:none}
.notice{margin:0 0 16px;padding:11px 13px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;color:var(--navy2);font-size:14px}
.notice p{margin:0}
.notice p+p{margin-top:6px}
.notice.stop{background:var(--red-soft);border-color:#FDA29B;color:#7A271A}
.notice:last-child{margin-bottom:0}
.rules{background:var(--amber-soft);border-color:var(--amber-line)}
.rules h2,.rules li{color:var(--amber)}
.panel ul{margin:0;padding-inline-start:18px;font-size:14px}
.panel li+li{margin-top:7px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.card .status{margin:12px 0 0;font-size:14px}
.status:empty{display:none}
#request,#out{scroll-margin-top:80px}
.meta{display:grid;gap:10px;margin-top:12px}
.ob{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.ob-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
.copy{padding:3px 9px;border-radius:8px;border:1px solid var(--line2);background:white;color:var(--blue);font-size:13px;font-weight:600}
.copy:hover{border-color:var(--blue)}
.ob pre,.token code{margin:0;font:14px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.preview{margin-top:12px;overflow:hidden}
.sheet{width:680px;transform-origin:top left}
[dir=rtl] .sheet{transform-origin:top right}
.plain{margin-top:12px}
.plain summary{color:var(--blue);font-weight:600;font-size:14px}
.plain pre{margin:8px 0 0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;font:14px/1.6 var(--font);white-space:pre-wrap}
.footer{background:var(--surface);border-top:1px solid var(--line)}
.footer-in{padding-block:20px 28px}
.footer h2{font-size:17px;color:var(--navy);margin:0 0 6px}
.contacts{width:100%;max-width:740px;border-collapse:collapse;table-layout:fixed;font-size:14px}
.contacts th,.contacts td{padding:7px 0;border-bottom:1px solid var(--line);text-align:start;font-weight:400}
.contacts th{width:46%;padding-inline-end:12px;font-weight:600}
@media(max-width:900px){.page{grid-template-columns:minmax(0,1fr)}aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(max-width:620px){:root{--pad:14px}.card{padding:16px}.grid,aside{grid-template-columns:minmax(0,1fr)}.panel{margin-bottom:0}.hero-in{padding-block:26px 60px}}

</style>
</head>

// Give the original viewBox its intrinsic size in image previews and the zoom dialog.
const OD_IMAGES = OD_SVG.map(svg => 'data:image/svg+xml,' + encodeURIComponent(
  svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" ')
));
const OD_TITLE = { en: 'Share a OneDrive folder', ar: 'شاركوا مجلداً على OneDrive' };
const OD_FILE_EXAMPLES = {
  special: { en: '01-Consultant letter, 02-Owner letter, 03-Drawings', ar: '01-خطاب الاستشاري، 02-خطاب المالك، 03-المخططات' },
  facade: { en: '01-Façade drawings, 02-Material certificates', ar: '01-مخططات الواجهات، 02-شهادات المواد' },
  event: { en: '01-Event template', ar: '01-نموذج الفعالية' },
  temporary: { en: '01-Cover page, 02-Duration letter…', ar: '01-صفحة الغلاف، 02-خطاب المدة…' }
};

function oneDriveSteps(lang, service) {
  return OD_TEXT[lang].map(([title, text], i) => {
    if (i === 0) {
      if (service === 'event') text = lang === 'ar'
        ? 'في OneDrive أنشئوا مجلداً واحداً لهذا الطلب وسمّوه باسم الفعالية.'
        : 'In OneDrive, create one folder for this request. Name it with the event name.';
      else if (lang === 'ar') text = text.replace('برقم الطلب', 'برقم المعاملة');
    }
    if (i === 1 && service !== 'temporary') {
      const example = OD_FILE_EXAMPLES[service]?.[lang];
      text = text.replace(' (' + OD_FILE_EXAMPLES.temporary[lang] + ')', example ? ' (' + example + ')' : '');
    }
    if (i === 6 && service === 'temporary') {
      [title, text] = lang === 'ar'
        ? ['أرسلوا الرابط عند الطلب', 'عندما تطلب الإدارة مجلد OneDrive، ألصقوا الرابط في ردّكم على رسالتها.']
        : ['Send the link when requested', 'When the department asks for a OneDrive folder, paste the link in your email reply.'];
    }
    return { title, text, src: OD_IMAGES[i] };
  });
}

// Only the guide's open/closed preference is stored.
function guidePreference(key) {
  let open = true;
  try { open = localStorage.getItem(key) !== 'closed'; } catch (_) { /* storage unavailable */ }
  return {
    get open() { return open; },
    save(value) {

const field = (id, props = {}) => ({id, type: "text", ...props});
const choice = (id, options, props) => field(id, {type: "select", options, ...props});

const email = id => field(id, {type: "email", ltr: true});
const link = (id, label) => field(id, {label, type: "url", ltr: true, full: true, help: "linkHelp"});
const senderFields = [choice("role", roles), field("company"), field("licence", {ltr: true, placeholderKey: "licenceExample"}), phone("phone"), email("email")];
const projectFields = [choice("projectType", projectTypes), choice("section", sections),
  field("area", {type: "number", optional: true, when: "buildings"}),
  field("height", {type: "number", optional: true, when: "buildings"}),
  choice("topic", topics), field("otherTopic", {when: "other"})];

const $ = selector => document.querySelector(selector);
const escape = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[c]);
let lang = new URLSearchParams(location.search).get("lang") === "ar" ? "ar" : "en";
const local = pair => pair[lang === "ar" ? 1 : 0];
const t = key => local(strings[key]);
const draft = Object.create(null);
const value = id => (draft[id] || "").trim();
let type = "", movedToGi = false, built = null;

function activeGroups() {
  const sender = ["details", senderFields];
  const project = ["project", [field("projectName", {optional: type !== "gi"}), ...projectFields]];
  if (type === "gi") return [sender, project, ["request", [
    field("inquiry", {type: "textarea", full: true, help: "inquiryHelp"}), link("giLink", "undertaking")]]];
  if (type === "meeting") return [["request", [appNo, system, choice("engineer", engineers),
    field("engineerComment", {type: "textarea", full: true, help: "commentHelp"}), link("meetingLink", "oneDrive")]], sender, project];
  if (type === "followup" && value("followupAs") === "owner") return [
    ["request", [system, appNo]], ["ownerDetails", [field("ownerName"), phone("ownerPhone"), email("ownerEmail")]]];
  if (type === "followup" && value("followupAs") === "cc") return [
    ["details", [field("name"), ...senderFields]], ["request", [appNo, field("submissionDate", {type: "date"}), system]], project];
  return [];
}

function isVisible(f) {
  if (f.when === "buildings") return value("section") === "buildings";
  if (f.when === "other") return value("topic") === "other";
  return true;
}

function renderField(f) {
  const attrs = `id="${f.id}" name="${f.id}" aria-describedby="${f.id}-help ${f.id}-error"${f.optional ? "" : " required"}${f.ltr ? ' dir="ltr"' : ""}`;
  const options = f.options && Object.entries(f.options).map(([id, labels]) => `<option value="${escape(id)}">${escape(local(labels))}</option>`).join("");
  const placeholder = f.placeholderKey ? t(f.placeholderKey) : f.placeholder;
  const control = f.type === "select" ? `<select ${attrs}><option value="">${t("choose")}</option>${options}</select>`
    : f.type === "textarea" ? `<textarea ${attrs} dir="auto" rows="4"></textarea>`
    : `<input ${attrs} type="${f.type}"${placeholder ? ` placeholder="${escape(placeholder)}"` : ""}${f.type === "number" ? ' min="0" step="any" inputmode="decimal"' : ""}>`;
  const mark = f.optional ? `<span class="opt">${t("optional")}</span>` : '<span class="req" aria-hidden="true">*</span>';
  return `<div class="f${f.full ? " full" : ""}" data-field="${f.id}"${isVisible(f) ? "" : " hidden"}>
    <label for="${f.id}">${t(f.label || f.id)} ${mark}</label>${control}
    <p class="help" id="${f.id}-help">${f.help ? t(f.help) : ""}</p><p class="err" id="${f.id}-error"></p></div>`;
}

function renderGuidance() {
  const rule = `<p>${t("meetingRule")}</p>`;
  const gi = `<div class="notice"${movedToGi ? ' role="status"' : ""}>${movedToGi ? `<p>${t("movedGi")}</p>` : rule}<p>${t("assigned")}</p></div>`;
  const meeting = `<div class="notice">${rule}<div class="toolbar"><button class="btn" id="noApp" type="button">${t("goGi")}</button></div></div>`;
  $("#guidance").innerHTML = type === "gi" ? gi : type === "meeting" ? meeting : "";
}

function renderRequest() {
  $("#request").hidden = !type;
  if (!type) return;
  $("#requestTitle").textContent = t(type);
  renderGuidance();
  const followupSelector = choice("followupAs", {cc: strings.cc, owner: strings.owner}, {full: true});
  $("#fields").innerHTML = (type === "followup" ? `<div class="fields grid">${renderField(followupSelector)}</div>` : "") +
    activeGroups().map(([heading, fields]) => `<section class="fields"><h3>${t(heading)}</h3><div class="grid">${fields.map(renderField).join("")}</div></section>`).join("");
  for (const input of $("#fields").querySelectorAll("input,select,textarea")) input.value = draft[input.id] || "";
  updateConditionalFields();
}

function updateConditionalFields() {
  for (const f of projectFields.filter(f => f.when)) {
    const input = $("#" + f.id);
    if (!input) continue;
    input.closest("[data-field]").hidden = !isVisible(f);
    input.disabled = !isVisible(f);
    if (input.disabled) markError(f.id, "");
  }
  if ($("#section-help")) $("#section-help").textContent = sectionReferences[value("section")] ? local(sectionReferences[value("section")]) : "";
}

function renderNotes() {
  const items = ["code", "subject", "engineer"];
  if (type === "gi" || type === "meeting") items.push("files");
  $("#notesList").innerHTML = items.map(key => `<li>${local(notes[key])}</li>`).join("");
}

function renderHowTo() {
  const example = (title, copy, src) => `<div class="guide-example"><div><h3>${escape(title)}</h3>
      <p>${escape(copy)}</p></div><button class="guide-figure" type="button" aria-haspopup="dialog"
      aria-label="${escape(t("guideEnlarge") + " — " + title)}"><img src="${escape(src)}"
      alt="${escape(title)}" decoding="async"><span>${escape(t("guideEnlarge"))}</span></button></div>`;
  const step = (key, image) => example(t(key), t(key + "Text"), PROJCONF_GUIDE_IMAGES[image + "-" + lang + ".webp"]);
  const sharing = oneDriveSteps(lang, "projconf").map(item => `<li>${example(item.title, item.text, item.src)}</li>`).join("");
  $("#guideContent").innerHTML = `<ol>
    <li>${step("guideChoose", "choose")}</li>
    <li>${step("guideFill", "fill")}<p>${escape(t("guideFiles"))}</p>
      <h3>${escape(OD_TITLE[lang])}</h3><ol data-onedrive-steps>${sharing}</ol></li>
    <li>${step("guideGenerate", "generate")}</li>
    <li>${step("guideCopy", "copy")}</li>
    <li>${step("guideSend", "send")}</li>
  </ol><h3>${escape(t("guideMistakes"))}</h3><p>${escape(t("guideMistakesText"))}</p>`;
}

function renderPage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("title");
  $("#brand").setAttribute("aria-label", document.title);
  $("#brand").title = document.title;
  $("#brandT").textContent = document.title;
  $("#brandS").textContent = PORTAL_ORG[lang];
  for (const meta of document.querySelectorAll('meta[name="application-name"], meta[name="apple-mobile-web-app-title"]')) meta.content = document.title;
  $('meta[property="og:title"]').content = document.title;
  $('meta[property="og:description"]').content = SERVICE_IDENTITY.projconf.description[lang];
  $("#guideDialog").setAttribute("aria-label", t("guideEnlarge"));
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  renderHowTo();
  $("#langLbl").textContent = lang === "ar" ? "English" : "العربية";
  $("#langLbl").lang = lang === "ar" ? "en" : "ar";
  $("#choices").innerHTML = INQUIRIES.map(id => `<label class="choice">
    <input type="radio" name="requestType" value="${id}" aria-labelledby="${id}-label" aria-describedby="${id}-hint"${id === type ? " checked" : ""}>
    <span class="tile"><b id="${id}-label">${t(id)}</b><small id="${id}-hint">${t(id + "Hint")}</small></span></label>`).join("");
  $("#selectedType").textContent = type ? t(type) : "";
  $("#flsLink").href = FLS_LINK;
  $("#contacts").innerHTML = [["special", "SAC@dcd.gov.ae"], ["support", "support.eservices@dcd.gov.ae"],
    ["finance", "Fddcd@dcd.gov.ae"], ["care", CUSTOMER_CARE_EMAIL]]
    .filter(([, address]) => address).map(([key, address]) => `<tr><th scope="row">${t(key)}</th>
    <td>${key === "special" ? t("sacEmail") + " " : ""}<bdi>${escape(address)}</bdi></td></tr>`).join("");
  renderRequest();
  renderNotes();
  if (built) showOutput();
}

function clearOutput() {
  if (!built) return;
  built = null;
  $("#out").hidden = true;
  for (const id of ["oTo", "oSubj", "oSheet", "oText", "copyStatus"]) $("#" + id).textContent = "";

}

function selectType(next, redirect = false) {
  clearOutput();
  type = next;
  movedToGi = redirect;
  $("#choices input[value=" + type + "]").checked = true;
  $("#selectedType").textContent = t(type);
  renderRequest();
  renderNotes();
  if (redirect) $("#requestTitle").focus();
}

function phoneDigits(input) {
  const number = input.replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))
    .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit))).replace(/[\s()-]/g, "");
  return /^(?:\+971|00971|971|0)?(5\d{8})$/.exec(number)?.[1] || "";
}

function checkLink(input) {
  let url;
  try { url = new URL(input); } catch (_) { return "linkError"; }
  const host = url.hostname;
  if (url.protocol !== "https:" || url.username || url.password || url.port ||
      !(["1drv.ms", "onedrive.live.com", "sharepoint.com"].includes(host) || host.endsWith(".sharepoint.com"))) return "linkError";
  let path = url.pathname;
  try { path = decodeURIComponent(path); } catch (_) { return "linkError"; }
  const nonPdf = /\.(?:zip|dwg|rar|7z|dxf|docx?|xlsx?|pptx?|png|jpe?g|txt)(?:$|[/?#&])/i;
  return nonPdf.test(path) || [...url.searchParams.values()].some(part => nonPdf.test(part)) ? "pdfError" : "";
}

function fieldError(f) {
  const input = $("#" + f.id);
  const entered = value(f.id);
  if (f.type === "number" && input.validity.badInput) return "numberError";
  if (f.type === "date" && (input.validity.badInput || (entered && !Number.isFinite(input.valueAsNumber)))) return "dateError";
  if (!entered) return f.optional ? "" : "required";
  if (f.id === "appNo" && (entered.length > 200 || /[|\r\n]|^PS-PE(?:D)?-[A-Z]{2,12}-\d{2}-\d{2}-\d{2,4}-[A-Z0-9]{6,9}$/i.test(entered))) return "appError";
  if (f.type === "tel" && !phoneDigits(entered)) return "phoneError";
  if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(entered)) return "emailError";
  if (f.type === "number" && (!Number.isFinite(Number(entered)) || Number(entered) < 0)) return "numberError";
  if (f.id === "inquiry" && Array.from(entered).length < 40) return "detailsError";
  if (f.type === "url") return checkLink(entered);
  return "";
}

function markError(id, error) {
  const input = $("#" + id);
  if (error) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
  $("#" + id + "-error").textContent = error ? t(error) : "";
}

function validate() {
  const fields = activeGroups().flatMap(([, fields]) => fields).filter(isVisible);
  if (type === "followup") fields.unshift(field("followupAs"));
  let first;
  for (const f of fields) {
    const error = fieldError(f);
    markError(f.id, error);
    if (error && !first) first = $("#" + f.id);
  }
  if (first) first.focus();
  return !first;
}

function displayValue(f) {
  const entered = value(f.id);
  if (f.options) return local(f.options[entered]);
  if (f.type === "tel") {
    const d = phoneDigits(entered);
    return `+971 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5)}`;
  }
  if (f.type === "date") return new Intl.DateTimeFormat(lang === "ar" ? "ar-AE" : "en-GB", {dateStyle: "long", timeZone: "UTC"}).format($("#" + f.id).valueAsNumber);
  return entered;
}

function emailModel() {
  const owner = type === "followup" && value("followupAs") === "owner";
  const groups = activeGroups().map(([heading, fields]) => ({
    title: t(heading), rows: fields.filter(f => isVisible(f) && value(f.id)).map(f => ({label: t(f.label || f.id), value: displayValue(f), url: f.type === "url", ltr: f.ltr}))
  }));
  const signature = owner ? [value("ownerName"), t("owner"), displayValue(phone("ownerPhone")), value("ownerEmail")]
    : [type === "followup" ? value("name") : "", displayValue(choice("role", roles)) + " — " + value("company"), displayValue(phone("phone")), value("email")];
  const part = id => value(id).replace(/[|\r\n]+/g, " ").replace(/\s+/g, " ").trim();
  // Both languages use the subject keywords understood by Admin Ledger 3.4.0.
  const project = owner ? "" : part("projectName");
  const subjectParts = type === "gi" ? ["GENERAL INQUIRY", project, part("company")]
    : [part("appNo"), ...(type === "followup" ? ["FOLLOW-UP", "Application Status"] : ["Meeting Request"]), project];
  const subject = subjectParts.filter(Boolean).join(" | ");
  return {title: t(type), org: PORTAL_ORG[lang], greeting: t("greeting"), summary: t(type + "Summary"),
    groups, signature: signature.filter(Boolean), closing: t("closing"), sign: t("sign"), subject};
}

// Paired formats adapted from the live generator. Both are built from the same email model.
function toText(email) {
  const rule = "=".repeat(40), divider = "-".repeat(40);
  const lines = [rule, email.org, email.title, rule, "", email.greeting, email.summary, ""];
  for (const group of email.groups) {
    lines.push(group.title, divider);
    for (const row of group.rows) lines.push(row.label + ": " + row.value);
    lines.push("");
  }
  lines.push(email.closing, "", email.sign, ...email.signature);
  return lines.join("\n");
}

function toHTML(email) {
  const font = "font-family:Calibri,'Segoe UI',Arial,Helvetica,sans-serif;";
  const p = "margin:0 0 9px;font-size:11.5pt;line-height:1.55;";
  const htmlValue = value => escape(value).replace(/\r?\n/g, "<br>");
  const groups = email.groups.map(group => `<tr><td colspan="2" bgcolor="#EDF3FA" style="padding:7px 20px;border-top:1px solid #C9D4E2;font-size:10pt;font-weight:bold;color:#2A5889">${escape(group.title)}</td></tr>` +
    group.rows.map(row => `<tr><td width="34%" valign="top" bgcolor="#F8FAFC" style="padding:7px 16px;border-top:1px solid #E4E9F0;font-size:10.5pt;font-weight:bold;color:#12243A">${escape(row.label)}</td>
    <td valign="top" style="padding:7px 16px;border-top:1px solid #E4E9F0;font-size:10.5pt;color:#1F2937;line-height:1.45;overflow-wrap:anywhere"><div dir="${row.ltr ? "ltr" : "auto"}">${row.url ? `<a href="${escape(row.value)}" rel="noopener noreferrer" target="_blank" style="color:#0A55BF;word-break:break-all">${escape(row.value)}</a>` : htmlValue(row.value)}</div></td></tr>`).join("")).join("");
  return `<table role="presentation" width="680" cellpadding="0" cellspacing="0" border="0" lang="${lang}" dir="${lang === "ar" ? "rtl" : "ltr"}" bgcolor="#FFFFFF" style="width:680px;table-layout:fixed;border-collapse:separate;border:1px solid #C9D4E2;border-radius:10px;${font}color:#1F2937">
    <colgroup><col width="231"><col width="449"></colgroup>
    <tr><td colspan="2" bgcolor="#12243A" style="background:#12243A;padding:14px 20px;border-radius:9px 9px 0 0;color:#FFFFFF">
      <div style="font-size:9pt;color:#BFD3EA;font-weight:bold">${escape(email.org)}</div>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:4px;${font}color:#FFFFFF"><tr><td style="font-size:14pt;font-weight:bold">${escape(email.title)}</td></tr></table>
    </td></tr>
    <tr><td colspan="2" style="padding:16px 20px 7px"><p style="${p}">${escape(email.greeting)}</p><p style="${p}">${escape(email.summary)}</p></td></tr>
    ${groups}
    <tr><td colspan="2" style="padding:16px 20px;border-top:1px solid #C9D4E2"><p style="${p}">${escape(email.closing)}</p><div style="font-size:11.5pt;line-height:1.55">${escape(email.sign)}${email.signature.map(line => `<div dir="auto">${escape(line)}</div>`).join("")}</div></td></tr>
  </table>`;
}

function fitSheet() {
  if (!built) return;
  const preview = $("#oBody"), sheet = $("#oSheet");
  const scale = Math.min(1, preview.clientWidth / sheet.offsetWidth);
  sheet.style.transform = `scale(${scale})`;
  preview.style.height = Math.ceil(sheet.offsetHeight * scale) + "px";
}

function showOutput() {
  const email = emailModel();
  built = { to: INBOX, subject: email.subject, text: toText(email), html: toHTML(email)};
  $("#oTo").textContent = INBOX;
  $("#oSubj").textContent = built.subject;
  $("#oSheet").innerHTML = built.html;
  $("#oText").textContent = built.text;
  const href = "mailto:" + INBOX + "?subject=" + encodeURIComponent(built.subject) + "&body=" + encodeURIComponent(built.text);
  $("#mailBtn").href = href;
  $("#longWarn").hidden = href.length <= 1800;
  $("#copyStatus").textContent = "";
  $("#out").hidden = false;
  fitSheet();
}

async function copyOutput(key) {
  const current = built;
  let ok = false;
  try {
    if (key === "body") {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([current.html], {type: "text/html"}),
        "text/plain": new Blob([current.text], {type: "text/plain"})
      })]);
    } else {
      await navigator.clipboard.writeText(current[key]);
    }
    ok = true;
  } catch (_) {
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;inset-block-start:0;inset-inline-start:-10000px";
    if (key === "body") holder.innerHTML = current.html;
    else holder.textContent = current[key];
    document.body.append(holder);
    const range = document.createRange();
    range.selectNodeContents(holder);
    const selection = getSelection();
    try {
      selection.removeAllRanges();
      selection.addRange(range);
      ok = document.execCommand("copy");
    } catch (_) {
      ok = false;
    } finally {
      selection.removeAllRanges();
      holder.remove();
    }
  }
  if (built === current) $("#copyStatus").textContent = t(ok ? "copied" : "copyFailed");
}

$("#langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  renderPage();
});
$("#choices").addEventListener("change", event => selectType(event.target.value));
$("#guidance").addEventListener("click", event => {
  if (event.target.id === "noApp") selectType("gi", true);
});
$("#fields").addEventListener("input", event => {
  const input = event.target;
  draft[input.id] = input.value;
  clearOutput();
  if (input.id === "followupAs") {
    renderRequest();
    $("#followupAs").focus();
  } else {
    markError(input.id, "");
    updateConditionalFields();
  }
});
$("#form").addEventListener("submit", event => {
  event.preventDefault();
  if (!type) return;
  if (type === "meeting" && !value("appNo")) {
    selectType("gi", true);
    return;
  }
  if (!validate()) return;
  if (!built) showOutput();
  $("#outputTitle").focus();
});
$("#out").addEventListener("click", event => {
  if (built && event.target.dataset.copy) copyOutput(event.target.dataset.copy);
});
const howTo = $("#howTo");
const guidePref = guidePreference("dcd-guide-projconf");
howTo.open = guidePref.open;
howTo.addEventListener("toggle", () => guidePref.save(howTo.open));
const guideDialog = $("#guideDialog");
howTo.addEventListener("click", event => {
  const picture = event.target.closest(".guide-figure")?.querySelector("img");
  if (!picture) return;
  const zoom = guideDialog.querySelector("img");
  zoom.src = picture.src;
  zoom.alt = picture.alt;
  guideDialog.showModal();
});
guideDialog.querySelector("button").addEventListener("click", () => guideDialog.close());
new ResizeObserver(fitSheet).observe($("#oSheet"));
window.addEventListener("resize", fitSheet);
renderPage();
</script>
</body>
