<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'">
<title>Projconf email generator — Dubai Civil Defence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFF;--surface2:#F8FAFC;--line:#E4E9F0;--line2:#D2DAE4;
  --ink:#152433;--muted:#5E6E7E;--navy:#12243A;--navy2:#1B3554;--blue:#2A5889;
  --blue-soft:#EDF3FA;--blue-line:#C9D8E8;--red:#B42318;--red-soft:#FEF3F2;
  --amber:#854211;--amber-soft:#FFFAEB;--amber-line:#FEDF89;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
  --font:Dubai,Inter,'IBM Plex Sans Arabic',system-ui,'Segoe UI',Arial,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;--wrap:1320px;--pad:24px;
}
[dir=rtl]{--font:Dubai,'IBM Plex Sans Arabic',Inter,system-ui,'Segoe UI',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font)}
a{color:var(--blue)}
a,pre,td,th{overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button,summary{cursor:pointer}
:focus-visible{outline:3px solid #507CA9;outline-offset:3px}
svg{flex:none}
.appbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar-in,.hero-in,.page,.footer-in{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--pad)}
.appbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;line-height:1.3}
.brand b,.brand small{display:block}
.brand b{font-size:15px;color:var(--navy)}
.brand small{font-size:12.5px;color:var(--muted)}
.mark{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(145deg,var(--navy2),var(--navy));box-shadow:0 4px 12px rgba(18,36,58,.22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--navy);font-weight:600;font-size:14px;text-align:center;text-decoration:none}
.btn:hover{background:var(--surface2);border-color:var(--blue)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2)}
.btn:disabled{opacity:.6;cursor:wait}
#langBtn{flex:none;min-height:40px}
.hero{position:relative;color:#fff;background:radial-gradient(900px 300px at 85% -10%,rgba(58,110,165,.55),transparent 60%),linear-gradient(120deg,#0E1D30,#12243A 45%,#1B3554)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px);pointer-events:none}
.hero-in{position:relative;z-index:1;padding-block:32px 67px}
.eyebrow{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:#BFD3EA;margin:0 0 8px}
.eyebrow::before{content:"";width:22px;height:2px;flex:none;background:#7FA6D1;align-self:center}
.hero h1{margin:0 0 8px;font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.2}
.hero p:last-child{margin:0;color:#D6E2F0}
.page{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,315px);gap:20px;align-items:start;margin-block:-38px 0;padding-bottom:30px}
main,aside,.f{min-width:0}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:24px;margin-bottom:16px}
.panel{padding:18px;margin-bottom:14px}
.card h2,.picker summary{font-size:19px;font-weight:700;color:var(--navy);margin:0 0 14px}
.panel h2,.fields h3{font-size:14px;font-weight:700;color:var(--blue);margin:0 0 10px}
.picker summary{list-style:none;display:flex;align-items:center;gap:12px;margin:0}
.picker summary::-webkit-details-marker{display:none}
.picker summary::after{content:"";flex:none;width:8px;height:8px;border:solid var(--blue);border-width:0 2px 2px 0;transform:rotate(45deg);margin-inline-start:auto;margin-block-start:-4px}
.picker[open] summary::after{transform:rotate(225deg);margin-block-start:4px}
.picker .selected{font-size:14px;color:var(--muted);font-weight:600}
.picker[open] .selected{display:none}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.choice{position:relative;min-width:0}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tile{display:flex;flex-direction:column;gap:4px;height:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff;color:var(--navy);font-size:14.5px}
.tile small{color:var(--muted);font-size:13px;line-height:1.45}
.choice:hover .tile{border-color:#A9BCD3}
.choice input:checked+.tile{border-color:var(--navy);background:var(--blue-soft);box-shadow:0 0 0 2px rgba(18,36,58,.10)}
.choice input:focus-visible+.tile{outline:3px solid #507CA9;outline-offset:2px}
.fields+.fields{margin-top:20px}
.fields h3{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fields h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.full{grid-column:1/-1}
.f label{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:var(--navy)}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line2);border-radius:12px;background:white;font-size:16px}
.f textarea{min-height:120px;resize:vertical}
.f [dir=ltr]{text-align:start}
.f [aria-invalid=true]{border-color:var(--red);background:var(--red-soft)}
.req,.err{color:var(--red)}
.help,.opt,.err{font-size:13px;margin:4px 0 0}
.help,.opt{color:var(--muted);font-weight:400}
.help:empty,.err:empty{display:none}
.notice{margin:0 0 16px;padding:11px 13px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;color:var(--navy2);font-size:14px}
.notice p{margin:0}
.notice p+p{margin-top:6px}
.notice.stop{background:var(--red-soft);border-color:#FDA29B;color:#7A271A}
.notice:last-child{margin-bottom:0}
.rules{background:var(--amber-soft);border-color:var(--amber-line)}
.rules h2,.rules li{color:var(--amber)}
.panel ul{margin:0;padding-inline-start:18px;font-size:14px}
.panel li+li{margin-top:7px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.card .status{margin:12px 0 0;font-size:14px}
.status:empty{display:none}
#request,#out{scroll-margin-top:80px}
.token{padding:10px 12px;border:1px solid var(--blue-line);border-radius:12px;background:var(--blue-soft)}
.meta{display:grid;gap:10px;margin-top:12px}
.ob{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.ob-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
.copy{padding:3px 9px;border-radius:8px;border:1px solid var(--line2);background:white;color:var(--blue);font-size:13px;font-weight:600}
.copy:hover{border-color:var(--blue)}
.ob pre,.token code{margin:0;font:14px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.preview{margin-top:12px;overflow:hidden}
.sheet{width:680px;transform-origin:top left}
[dir=rtl] .sheet{transform-origin:top right}
.plain{margin-top:12px}
.plain summary{color:var(--blue);font-weight:600;font-size:14px}
.plain pre{margin:8px 0 0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;font:14px/1.6 var(--font);white-space:pre-wrap}
.footer{background:var(--surface);border-top:1px solid var(--line)}
.footer-in{padding-block:20px 28px}
.footer h2{font-size:17px;color:var(--navy);margin:0 0 6px}
.contacts{width:100%;max-width:740px;border-collapse:collapse;table-layout:fixed;font-size:14px}
.contacts th,.contacts td{padding:7px 0;border-bottom:1px solid var(--line);text-align:start;font-weight:400}
.contacts th{width:46%;padding-inline-end:12px;font-weight:600}
@media(max-width:900px){.page{grid-template-columns:minmax(0,1fr)}aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(max-width:620px){:root{--pad:14px}.card{padding:16px}.grid,aside{grid-template-columns:minmax(0,1fr)}.panel{margin-bottom:0}.hero-in{padding-block:26px 60px}}
@media(max-width:380px){.tile{padding:9px 10px}.brand{gap:8px}.appbar-in{gap:8px}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
      <div><b data-t="org"></b><small data-t="department"></small></div>
    </div>
    <button class="btn primary" id="langBtn" type="button"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span id="langLbl"></span></button>
  </div>
</header>
<section class="hero">
  <div class="hero-in">
    <p class="eyebrow" data-t="banner"></p>
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
  </div>
</section>
<div class="page">
  <main>
    <details class="card picker" open>
      <summary><span id="pickerLabel" data-t="requestType"></span><span class="selected" id="selectedType"></span></summary>
      <div class="choices" id="choices" role="radiogroup" aria-labelledby="pickerLabel"></div>
    </details>
    <section class="card" id="request" aria-labelledby="requestTitle" hidden>
      <h2 id="requestTitle" tabindex="-1"></h2>
      <div id="guidance"></div>
      <form id="form" autocomplete="off" novalidate>
        <div id="fields"></div>
        <div class="toolbar" id="generateActions"><button class="btn primary" id="genBtn" type="submit" data-t="generate"></button></div>
        <div class="notice stop" id="dateError" role="alert" hidden></div>
        <div id="uploadPrompt" hidden>
          <p class="notice" data-t="portalNote"></p>
          <a class="btn primary" id="upload" href="../portal/#/new/tp" data-t="upload"></a>
        </div>
        <p class="status" id="formStatus" role="status"></p>
      </form>
    </section>
    <section class="card" id="out" aria-labelledby="outputTitle" hidden>
      <h2 id="outputTitle" data-t="output" tabindex="-1"></h2>
      <div class="token ob-h"><span data-t="reference"></span><code id="oToken" dir="ltr"></code><button class="copy" type="button" data-copy="token" data-t="copyRef"></button></div>
      <div class="meta">
        <div class="ob"><div class="ob-h"><span data-t="to"></span><button class="copy" type="button" data-copy="to" data-t="copyTo"></button></div><pre id="oTo" dir="ltr"></pre></div>
        <div class="ob"><div class="ob-h"><span data-t="subject"></span><button class="copy" type="button" data-copy="subject" data-t="copySubject"></button></div><pre id="oSubj"></pre></div>
        <div class="ob">
          <div class="ob-h"><span data-t="body"></span><button class="copy" type="button" data-copy="body" data-t="copyBody"></button></div>
          <div class="preview" id="oBody"><div class="sheet" id="oSheet"></div></div>
          <details class="plain"><summary data-t="plain"></summary><pre id="oText"></pre><button class="copy" type="button" data-copy="text" data-t="copyText"></button></details>
        </div>
      </div>
      <div class="toolbar"><a class="btn primary" id="mailBtn" data-t="openMail"></a></div>
      <p class="status" id="longWarn" data-t="longEmail" hidden></p>
      <p class="status" id="copyStatus" role="status"></p>
    </section>
  </main>
  <aside>
    <section class="panel rules" id="notes" aria-labelledby="notesTitle">
      <h2 id="notesTitle" data-t="notes"></h2>
      <ul id="notesList"></ul>
    </section>
    <section class="panel" aria-labelledby="resourcesTitle">
      <h2 id="resourcesTitle" data-t="resources"></h2>
      <ul><li><a id="flsLink" target="_blank" rel="noopener noreferrer" data-t="fls"></a></li><li data-t="annex"></li></ul>
    </section>
  </aside>
</div>
<footer class="footer">
  <div class="footer-in">
    <h2 id="contactsTitle" data-t="contacts"></h2>
    <table class="contacts" aria-labelledby="contactsTitle"><tbody id="contacts"></tbody></table>
  </div>
</footer>

  const options = f.options && Object.entries(f.options).map(([id, labels]) => `<option value="${escape(id)}">${escape(local(labels))}</option>`).join("");
  const control = f.type === "select" ? `<select ${attrs}><option value="">${t("choose")}</option>${options}</select>`
    : f.type === "textarea" ? `<textarea ${attrs} dir="auto" rows="4"></textarea>`
    : `<input ${attrs} type="${f.type}"${f.placeholder ? ` placeholder="${f.placeholder}"` : ""}${f.type === "number" ? ' min="0" step="any" inputmode="decimal"' : ""}>`;
  const mark = f.optional ? `<span class="opt">${t("optional")}</span>` : '<span class="req" aria-hidden="true">*</span>';
  return `<div class="f${f.full ? " full" : ""}" data-field="${f.id}"${isVisible(f) ? "" : " hidden"}>
    <label for="${f.id}">${t(f.label || f.id)} ${mark}</label>${control}
    <p class="help" id="${f.id}-help">${f.help ? t(f.help) : ""}</p><p class="err" id="${f.id}-error"></p></div>`;
}

}

function phoneDigits(input) {
  const number = input.replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))
    .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit))).replace(/[\s()-]/g, "");
  return /^(?:\+971|00971|971|0)?(5\d{8})$/.exec(number)?.[1] || "";
}

function checkLink(input) {
  let url;
  try { url = new URL(input); } catch (_) { return "linkError"; }
  const host = url.hostname;
  if (url.protocol !== "https:" || url.username || url.password || url.port ||
      !(["1drv.ms", "onedrive.live.com", "sharepoint.com"].includes(host) || host.endsWith(".sharepoint.com"))) return "linkError";
  let path = url.pathname;
  try { path = decodeURIComponent(path); } catch (_) { return "linkError"; }
  const nonPdf = /\.(?:zip|dwg|rar|7z|dxf|docx?|xlsx?|pptx?|png|jpe?g|txt)(?:$|[/?#&])/i;
  return nonPdf.test(path) || [...url.searchParams.values()].some(part => nonPdf.test(part)) ? "pdfError" : "";
}

function fieldError(f) {
  const input = $("#" + f.id);
  const entered = value(f.id);
  if (f.type === "number" && input.validity.badInput) return "numberError";
  if (f.type === "date" && (input.validity.badInput || (entered && !Number.isFinite(input.valueAsNumber)))) return "dateError";
  if (!entered) return f.optional ? "" : "required";
  if (f.type === "tel" && !phoneDigits(entered)) return "phoneError";
  if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(entered)) return "emailError";
  if (f.type === "number" && (!Number.isFinite(Number(entered)) || Number(entered) < 0)) return "numberError";
  if (f.id === "inquiry" && Array.from(entered).length < 40) return "detailsError";
  if (f.type === "url") return checkLink(entered);
  return "";
}

function markError(id, error) {
  const input = $("#" + id);
  if (error) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
  $("#" + id + "-error").textContent = error ? t(error) : "";
}

function validate() {
  const fields = activeGroups().flatMap(([, fields]) => fields).filter(isVisible);
  if (type === "followup") fields.unshift(field("followupAs"));
  let first;
  for (const f of fields) {
    const error = fieldError(f);
    markError(f.id, error);
    if (error && !first) first = $("#" + f.id);
  }
  if (first) first.focus();
  return !first;
}

async function issueToken(code) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch(REF_ENDPOINT + "?action=ref&code=" + encodeURIComponent(code), {
      method: "GET", credentials: "omit", cache: "no-store", signal: controller.signal
    });
    const result = response.ok ? await response.json() : null;
    const token = result?.ref;
    return typeof token === "string" && TOKEN_RE.test(token) && token.split("-")[2] === code ? token : "";
  } catch (_) {
    return "";
  } finally {
    clearTimeout(timer);
  }
}

function displayValue(f) {
  const entered = value(f.id);
  if (f.options) return local(f.options[entered]);
  if (f.type === "tel") {
    const d = phoneDigits(entered);
    return `+971 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5)}`;
  }
  if (f.type === "date") return new Intl.DateTimeFormat(lang === "ar" ? "ar-AE" : "en-GB", {dateStyle: "long", timeZone: "UTC"}).format($("#" + f.id).valueAsNumber);
  return entered;
}

function emailModel(token) {
  const owner = type === "followup" && value("followupAs") === "owner";
  const groups = activeGroups().filter(([heading]) => heading !== "ownerDetails").map(([heading, fields]) => ({
    title: t(heading), rows: fields.filter(f => isVisible(f) && value(f.id)).map(f => ({label: t(f.label || f.id), value: displayValue(f), url: f.type === "url", ltr: f.ltr}))
  }));
  const signature = owner ? [value("ownerName"), t("owner"), displayValue(phone("ownerPhone")), value("ownerEmail")]
    : [type === "followup" ? value("name") : "", displayValue(choice("role", roles)) + " — " + value("company"), displayValue(phone("phone")), value("email")];
  const quote = lang === "ar" ? `يرجى ذكر الرقم المرجعي ${token} في جميع المراسلات.` : `Please quote reference ${token} in all correspondence.`;
  const application = type === "meeting" || owner ? value("appNo").replace(/[\r\n]+/g, " ") : "";
  return {token, title: t(type), org: t("org") + " · " + t("department"), greeting: t("greeting"), summary: t(type + "Summary"),
    groups, signature: signature.filter(Boolean), closing: t("closing"), sign: t("sign"), quote,
    subject: [token, t(type), application].filter(Boolean).join(" | ")};
}

// Paired formats adapted from the live generator. Both are built from the same email model.
function toText(email) {
  const rule = "=".repeat(40), divider = "-".repeat(40);
  const lines = [rule, email.org, email.title + " | " + email.token, rule, "", email.greeting, email.summary, ""];
  for (const group of email.groups) {
    lines.push(group.title, divider);
    for (const row of group.rows) lines.push(row.label + ": " + row.value);
    lines.push("");
  }
  lines.push(email.closing, "", email.sign, ...email.signature, "", rule, email.quote, rule);
  return lines.join("\n");
}

    <tr><td colspan="2" style="padding:16px 20px 7px"><p style="${p}">${escape(email.greeting)}</p><p style="${p}">${escape(email.summary)}</p></td></tr>
    ${groups}
    <tr><td colspan="2" style="padding:16px 20px;border-top:1px solid #C9D4E2"><p style="${p}">${escape(email.closing)}</p><div style="font-size:11.5pt;line-height:1.55">${escape(email.sign)}${email.signature.map(line => `<div dir="auto">${escape(line)}</div>`).join("")}</div></td></tr>
    <tr><td colspan="2" bgcolor="#F4F6F9" style="padding:9px 20px;border-top:1px solid #E4E9F0;border-radius:0 0 9px 9px;font-size:9pt;color:#5E6E7E">${escape(email.quote).replace(email.token, `<b dir="ltr" style="font-family:Consolas,monospace">${email.token}</b>`)}</td></tr></table>`;
}

function fitSheet() {
  if (!built) return;
  const preview = $("#oBody"), sheet = $("#oSheet");
  const scale = Math.min(1, preview.clientWidth / sheet.offsetWidth);
  sheet.style.transform = `scale(${scale})`;
  preview.style.height = Math.ceil(sheet.offsetHeight * scale) + "px";
}

function showOutput(token) {
  const email = emailModel(token);
  built = {token, to: INBOX, subject: email.subject, text: toText(email), html: toHTML(email)};
  $("#oToken").textContent = token;
  $("#oTo").textContent = INBOX;
  $("#oSubj").textContent = built.subject;
  $("#oSheet").innerHTML = built.html;
  $("#oText").textContent = built.text;
  const href = "mailto:" + INBOX + "?subject=" + encodeURIComponent(built.subject) + "&body=" + encodeURIComponent(built.text);
  $("#mailBtn").href = href;
  $("#longWarn").hidden = href.length <= 1800;
  $("#copyStatus").textContent = "";
  $("#out").hidden = false;
  fitSheet();
}

async function copyOutput(key) {
  const current = built;
  let ok = false;
  try {
    if (key === "body") {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([current.html], {type: "text/html"}),
        "text/plain": new Blob([current.text], {type: "text/plain"})
      })]);
    } else {
      await navigator.clipboard.writeText(current[key]);
    }
    ok = true;
  } catch (_) {
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;inset-block-start:0;inset-inline-start:-10000px";
    if (key === "body") holder.innerHTML = current.html;
    else holder.textContent = current[key];
    document.body.append(holder);
    const range = document.createRange();
    range.selectNodeContents(holder);
    const selection = getSelection();
    try {
      selection.removeAllRanges();
      selection.addRange(range);
      ok = document.execCommand("copy");
    } catch (_) {
      ok = false;
    } finally {
      selection.removeAllRanges();
      holder.remove();
    }
  }
  if (built === current) $("#copyStatus").textContent = t(ok ? "copied" : "copyFailed");
}

$("#langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  renderPage();
});
$("#choices").addEventListener("change", event => selectType(event.target.value));
$("#guidance").addEventListener("click", event => {
  if (event.target.id === "noApp") selectType("gi", true);
});
$("#fields").addEventListener("input", event => {
  const input = event.target;
  draft[input.id] = input.value;
  clearOutput();
  if (input.id === "followupAs") {
    renderRequest();
    $("#followupAs").focus();
  } else {
    markError(input.id, "");
    updateConditionalFields();
    updateDates();
    renderStatus();
  }
});
$("#upload").addEventListener("click", event => {
  if (type !== "tp" || tpDateError() || !validate()) event.preventDefault();
});
$("#form").addEventListener("submit", async event => {
  event.preventDefault();
  if (!type || type === "tp" || pending) return;
  if (type === "meeting" && !value("appNo")) {
    selectType("gi", true);
    return;
  }
  if (!validate()) return;
  if (built) {
    $("#outputTitle").focus();
    return;
  }
  const current = revision;
  pending = true;
  formStatus = "requesting";
  renderStatus();
  const token = await issueToken(REF_CODES[type]);
  pending = false;
  if (current === revision) {
    formStatus = token ? "" : "refError";
    if (token) {
      showOutput(token);
      $("#outputTitle").focus();
    }
  }
  renderStatus();
});
$("#out").addEventListener("click", event => {
  if (built && event.target.dataset.copy) copyOutput(event.target.dataset.copy);
});
new ResizeObserver(fitSheet).observe($("#oSheet"));
window.addEventListener("resize", fitSheet);
renderPage();
</script>
</body>
</html>
