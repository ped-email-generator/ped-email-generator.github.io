  --pend: #6f7c88; --pend-soft: #eef1f4; --info: #24425a; --info-soft: #e6eef4;
  --hero1: #28485c; --hero2: #1b2f3b;
  --font: 'IBM Plex Sans Arabic', 'Inter', 'Segoe UI', Tahoma, sans-serif;
  --mono: 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;
  --r: 10px; --r-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 32, 48, .05), 0 4px 16px rgba(16, 32, 48, .06);
  --shadow-lg: 0 2px 6px rgba(16, 32, 48, .06), 0 18px 48px rgba(16, 32, 48, .12);
  --wrap: 1120px;
  color-scheme: light;
}
@media not all {
  :root {
    --bg: #0f1720; --surface: #16212c; --surface2: #1a2632; --hover: #1e2b38; --sel: #22354a;
    --ink: #e4ebf1; --ink2: #c3cfda; --muted: #95a5b4; --faint: #7d8e9e;
    --line: #243342; --line2: #2f4253;
    --navy: #8db4d3; --navy2: #a8c8e2; --navy-soft: #1d3141; --blue: #6f93ab;
    --gold: #c9b07a; --gold2: #d8c08c; --gold-soft: #2c2618; --gold-ink: #d8c08c;
    --ok: #4fb67e; --ok-soft: #173327; --warn: #d9a23f; --warn-soft: #33280f; --bad: #e0675f; --bad-soft: #3a1c1b;
    --pend: #93a1ae; --pend-soft: #222e39; --info: #8db4d3; --info-soft: #1d3141;
    --hero1: #16283a; --hero2: #0f1a26;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 18px 48px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--navy); }
.hidden { display: none !important; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.mono { font-family: var(--mono); letter-spacing: .01em; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 16px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.mt0 { margin-top: 0 !important; } .mt2 { margin: 2px 0 0; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt12 { margin-top: 12px; } .mt14 { margin-top: 14px; }
.fs12 { font-size: 12.5px; } .fs13 { font-size: 13px; } .pre { white-space: pre-wrap; }
.stack { display: grid; gap: 10px; }
.keys.one { grid-template-columns: 1fr; }
.axlink { background: none; border: 0; padding: 0; margin-inline-start: 6px; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }
.hp { position: absolute !important; inset-inline-start: -9999px; width: 1px; height: 1px; overflow: hidden; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--navy) 55%, transparent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 26px; height: 26px; }

/* ---------- dev banner ---------- */
.devbar { background: var(--gold-soft); color: var(--warn); border-bottom: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); font-size: 13px; }
.devbar .wrap { display: flex; gap: 10px; align-items: center; min-height: 34px; flex-wrap: wrap; }
.devbar a { color: inherit; font-weight: 600; }

/* ---------- header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; min-width: 0; }
.brand .mark { width: 38px; height: 38px; border-radius: 9px; background: var(--navy); display: grid; place-items: center; position: relative; flex: none; overflow: hidden; }
.brand .mark::after { content: ''; position: absolute; inset-inline: 0; bottom: 0; height: 4px; background: var(--gold); }
.brand .mark svg { width: 21px; height: 21px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media not all { .brand .mark { background: #28485c; } }
.brand .t { line-height: 1.25; min-width: 0; }
.brand .t b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .t b i { font-style: normal; color: var(--gold); }
.brand .t span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top nav { margin-inline-start: auto; display: flex; align-items: center; gap: 4px; }
.top nav a, .top nav button { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--ink2); text-decoration: none; cursor: pointer; font-size: 14px; white-space: nowrap; }
.top nav a:hover, .top nav button:hover { background: var(--hover); color: var(--ink); }
.top nav a.on { background: var(--navy-soft); color: var(--navy); font-weight: 600; }
.top nav .lang { border: 1px solid var(--line2); font-weight: 600; }
/* on phones the header links show their icon only; the words stay for screen readers */
@media (max-width: 720px) { .top nav a .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .brand .t span { display: none; } .top nav a, .top nav button { padding: 0 10px; } }

/* ---------- main ---------- */
main { flex: 1; }
.page { padding-top: 22px; padding-bottom: 56px; }   /* (only top and bottom: .wrap keeps the 16 px side gutter) */
.page-head { margin: 4px 0 18px; }
.page-head h1 { font-size: 23px; line-height: 1.3; margin: 0; font-weight: 600; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--navy); }

/* ---------- hero (home) ---------- */
.hero { background: radial-gradient(1200px 380px at 85% -10%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 60%), linear-gradient(180deg, #ffffff, var(--bg)); color: var(--ink); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
[dir="rtl"] .hero { background: radial-gradient(1200px 380px at 15% -10%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 60%), linear-gradient(180deg, #ffffff, var(--bg)); }
.hero::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(40,72,92,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(40,72,92,.05) 1px, transparent 1px); background-size: 34px 34px; mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 85%); pointer-events: none; }
.hero .wrap { position: relative; padding-top: 44px; padding-bottom: 92px; }
.hero .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--gold-ink); letter-spacing: .02em; }
.hero .eyebrow::before { content: ''; width: 18px; height: 2px; background: var(--gold); border-radius: 2px; }
.hero h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.2; margin: 10px 0 10px; font-weight: 700; max-width: 760px; color: var(--navy2); }
.hero p { margin: 0; max-width: 640px; color: var(--ink2); font-size: 16px; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; font-size: 13.5px; color: var(--muted); }
.hero .facts span { display: inline-flex; align-items: center; gap: 7px; }
.hero .facts svg { stroke: var(--gold); }
.actions-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: -64px; position: relative; z-index: 2; }
@media (max-width: 720px) { .actions-2 { grid-template-columns: 1fr; } }
.action { display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); text-decoration: none; color: inherit; cursor: pointer; transition: transform .15s, border-color .15s; text-align: start; width: 100%; }
.action:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--navy) 40%, var(--line)); }
.action .ic { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--navy); color: #fff; }
.action.alt .ic { background: var(--gold-soft); color: var(--gold2); }
.action b { display: block; font-size: 17px; font-weight: 600; }
.action span { display: block; color: var(--muted); font-size: 13.5px; }
.action .go { margin-inline-start: auto; color: var(--faint); }
[dir="rtl"] .action .go svg, [dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- section titles ---------- */
.sec-h { display: flex; align-items: flex-end; gap: 12px; margin: 34px 0 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 18px; margin: 0; font-weight: 600; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.sec-h .end { margin-inline-start: auto; }

/* ---------- service cards ---------- */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
.card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: inherit; cursor: pointer; text-align: start; transition: border-color .15s, transform .15s, box-shadow .15s; min-height: 150px; }
.card:hover { border-color: color-mix(in srgb, var(--navy) 45%, var(--line)); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.card .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); }
.card b { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
.card .foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 12px; font-size: 11.5px; font-weight: 500; background: var(--gold-soft); color: var(--gold-ink); white-space: nowrap; }
.chip.navy { background: var(--navy-soft); color: var(--navy); }
.chip.grey { background: var(--pend-soft); color: var(--pend); }

/* ---------- rules / info strip ---------- */
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .rules { grid-template-columns: 1fr; } }
.rule { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.rule .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold2); flex: none; }
.rule b { display: block; font-size: 14px; font-weight: 600; }
.rule span { display: block; font-size: 13px; color: var(--muted); }
.other { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .other { grid-template-columns: 1fr; } }
.other .rule .ic { background: var(--pend-soft); color: var(--pend); }
.other a.addr { overflow-wrap: anywhere; font-family: var(--mono); font-size: 13px; direction: ltr; unicode-bidi: isolate; }

/* ---------- panels, stepper ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 14px; }
.panel > h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
.panel > .desc { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.layout > aside { position: sticky; top: 84px; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .layout > aside { position: static; } }
/* the steps: a list; the current one says so (aria-current), completed ones are buttons */
.stepper { display: flex; gap: 6px; margin: 0 0 16px; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stepper .st { flex: 1; display: flex; min-width: 0; margin: 0; padding: 0; }
.stepper .stb { flex: 1; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-family: inherit; font-size: 13.5px; line-height: 1.4; min-width: 0; border: 0; background: transparent; text-align: start; }
.stepper .stb i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 600; font-size: 12.5px; background: var(--pend-soft); color: var(--pend); flex: none; }
.stepper .stb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper .st.on .stb { background: var(--navy-soft); color: var(--navy); font-weight: 600; }
.stepper .st.on .stb i { background: var(--navy); color: #fff; }
@media not all { .stepper .st.on .stb i { background: #46677c; } }
.stepper .st.done .stb i { background: var(--ok); color: #fff; }
.stepper .st.done .stb { color: var(--ink2); cursor: pointer; }
.stepper button.stb:hover { background: var(--hover); }
@media (max-width: 560px) {
  .stepper .st:not(.on) .stb span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .stepper .st:not(.on) { flex: none; }
  .stepper .st.on .stb span { white-space: normal; overflow-wrap: anywhere; }
}
.side h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.side .svc { display: flex; gap: 12px; align-items: center; }
.side .svc .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); flex: none; }
.side .svc b { display: block; font-size: 15px; }
.side ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; color: var(--ink2); }
.side ul li { display: flex; gap: 8px; } .side ul li svg { color: var(--gold2); margin-top: 3px; }

/* ---------- forms ---------- */
.fsec { margin-top: 18px; }
.fsec:first-child { margin-top: 0; }
.fsec > h3 { font-size: 13.5px; font-weight: 600; color: var(--navy); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.fsec > h3::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.grid > .full { grid-column: 1 / -1; }
.grid.one { grid-template-columns: 1fr; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl, .field > .lblrow > label { font-size: 13px; color: var(--ink2); font-weight: 500; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field > .lblrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }   /* the label and its ? button, side by side */
.field .req { color: var(--bad); font-weight: 600; }
.field .opt { color: var(--faint); font-weight: 400; font-size: 12px; }
.field .hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.field .ohint { font-size: 12.5px; color: var(--muted); padding: 6px 10px; border-radius: 7px; background: var(--surface2); border: 1px dashed var(--line2); }
/* the field's own error line only (an upload row is not hidden by this rule) */
.field > .err { font-size: 12.5px; color: var(--bad); display: none; }
.field.bad > .err { display: block; }
.field.bad .input, .field.bad .select, .field.bad .drop, .field.bad .phone { border-color: var(--bad); }
.input, .select, textarea.input { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--surface); transition: border-color .15s, box-shadow .15s; }
textarea.input { min-height: 104px; resize: vertical; line-height: 1.6; }
.select { appearance: none; padding-inline-end: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
[dir="rtl"] .select { background-position: 13px 55%, 18px 55%; }
.input:focus, .select:focus, textarea.input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 18%, transparent); }
.input::placeholder, textarea.input::placeholder { color: var(--faint); }
input[type="date"].input { min-height: 42px; }
@media (max-width: 640px) { .input, .select, textarea.input { font-size: 16px; } }
.phone { display: flex; align-items: stretch; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; direction: ltr; }
.phone:focus-within { border-color: var(--navy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 18%, transparent); }
.phone b { display: grid; place-items: center; padding: 0 11px; background: var(--surface2); border-inline-end: 1px solid var(--line); color: var(--muted); font-weight: 500; font-size: 14px; }
.phone input { border: 0; outline: none; flex: 1; min-width: 0; padding: 8px 12px; background: transparent; min-height: 40px; }
.qbtn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line2); background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 700; line-height: 1; cursor: pointer; display: inline-grid; place-items: center; padding: 0; flex: none; }
.qbtn:hover, .qbtn[aria-expanded="true"] { border-color: var(--navy); color: var(--navy); }
.infobox { font-size: 13px; color: var(--ink2); background: var(--info-soft); border-radius: 8px; padding: 10px 12px; line-height: 1.6; }
.infobox p { margin: 0 0 6px; } .infobox p:last-child { margin: 0; }
.infobox .cref { display: inline-block; margin-inline-start: 6px; font-size: 11.5px; color: var(--gold-ink); font-weight: 600; }
.gate { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--surface2); cursor: pointer; }
.gate input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--navy); flex: none; }
.field.bad .gate { border-color: var(--bad); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 9px 2px; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--navy); flex: none; }

/* notices */
.note { border-radius: var(--r-sm); padding: 12px 14px; font-size: 13.5px; line-height: 1.65; background: var(--info-soft); color: var(--ink2); border-inline-start: 3px solid var(--navy); }
.note.warn { background: var(--warn-soft); border-inline-start-color: var(--gold); }
.note.bad { background: var(--bad-soft); border-inline-start-color: var(--bad); }
.note.ok { background: var(--ok-soft); border-inline-start-color: var(--ok); }
.note b.h { display: block; color: var(--ink); margin-bottom: 4px; font-size: 14px; }
.note ul { margin: 6px 0 0; padding-inline-start: 20px; } .note li { margin: 2px 0; }
.note .nbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.note + .note, .note + .fsec, .fsec + .note { margin-top: 14px; }
/* (18 Nov 2026) red notes: choose the correct service; save the reference and code in two places */
.note.bad > strong { color: var(--bad); }
.right-svc { margin: 14px 0 18px; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); border-inline-start-width: 4px; }
.right-svc > strong { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.note ul.right-list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.right-list li { display: flex; gap: 8px; align-items: flex-start; margin: 0; }
.right-list li .i { flex: none; margin-top: 3px; }
.right-list li.do .i { color: var(--ok); } .right-list li.dont .i { color: var(--bad); }
.right-list li.dont span { color: var(--ink); font-weight: 600; }
.code-is { margin: 10px 0 0; font-size: 13.5px; color: var(--ink2); }
.note[data-keep] { margin-top: 12px; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); border-inline-start-width: 4px; font-size: 14px; }
.note[data-keep] > strong { display: flex; align-items: center; gap: 6px; font-size: 15px; margin: 2px 0 4px; }
.note[data-wrong] { margin-bottom: 14px; }
.note[data-wrong] p { color: var(--ink); font-weight: 600; }
@media print { .note[data-keep] { border-color: #a33b33; } }

/* templates published by the admins */
.tplbox { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 12px; border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); border-radius: var(--r-sm); background: var(--gold-soft); }
.tplbox .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--gold2); flex: none; }
.tplbox .tx { flex: 1; min-width: 0; }
.tplbox .tx b { display: block; font-size: 14px; font-weight: 600; }
.tplbox .tx span { display: block; font-size: 12.5px; color: var(--muted); }
.tplbox .bt { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 560px) { .tplbox { flex-wrap: wrap; } .tplbox .bt { width: 100%; } }

/* list fields */
.list { display: grid; gap: 8px; }
.list .row { display: grid; gap: 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface2); }
.list .row .n { font-size: 12px; color: var(--faint); font-weight: 600; }
.list .row .cells { display: grid; gap: 8px; grid-template-columns: var(--cols); }
@media (max-width: 640px) { .list .row .cells { grid-template-columns: 1fr; } }
.list .row .cells label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.list .row .hd { display: flex; align-items: center; justify-content: space-between; }

/* file drop — the file input stays in the tab order (visually hidden, not display:none), so the keyboard reaches it */
.drop { position: relative; border: 1.5px dashed var(--line2); border-radius: var(--r-sm); background: var(--surface2); padding: 16px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--navy); background: var(--navy-soft); }
.drop:focus-within { border-color: var(--navy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 18%, transparent); }
.drop .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--navy); flex: none; }
.drop b { display: block; font-size: 14px; font-weight: 600; }
.drop span { display: block; font-size: 12.5px; color: var(--muted); }
.drop input { position: absolute; inset-inline-start: 0; top: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.files { display: grid; gap: 6px; margin-top: 8px; }
.file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 13.5px; }
.file .pdf { width: 32px; height: 32px; border-radius: 7px; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; letter-spacing: .02em; }
.file .nm { flex: 1; min-width: 0; }
.file .nm b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; text-align: start; }
.file .nm span { display: block; font-size: 12px; color: var(--muted); }
.file.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.file.bad .nm span { color: var(--bad); }
.file.ok .nm span { color: var(--ok); }
.bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; position: relative; }
.bar::after { content: ''; position: absolute; inset-block: 0; width: 35%; background: var(--navy); border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { inset-inline-start: -35%; } 100% { inset-inline-start: 100%; } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 16px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 500; text-decoration: none; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--navy2); }
@media not all { .btn.primary { background: #46677c; border-color: #46677c; } .btn.primary:hover { background: #56798f; } }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #213744; font-weight: 600; }   /* dark text: white on gold is below 4.5:1 */
.btn.gold:hover { background: color-mix(in srgb, var(--gold) 85%, #fff); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--navy); }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger.arm { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm, .btn-s { min-height: 32px; padding: 0 11px; font-size: 13px; }
.btn.lg { min-height: 48px; padding: 0 24px; font-size: 15.5px; }
.btn.block { width: 100%; }
.navrow { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }
.navrow .end { margin-inline-start: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--navy); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

/* ---------- review ---------- */
.kv { display: grid; grid-template-columns: minmax(140px, 36%) minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.kv > div { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
.kv > .k { background: var(--surface2); color: var(--muted); }
.kv .sub { display: block; font-size: 12px; color: var(--muted); }
.kv-h { font-size: 13px; font-weight: 600; color: var(--navy); margin: 16px 0 8px; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv > .k { border-bottom: 0; padding-bottom: 0; } }
.decl { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 12px; margin-top: 8px; }
.decl .check + .check { border-top: 1px solid var(--line); }

/* ---------- receipt ---------- */
.receipt { max-width: 720px; margin: 0 auto; }
.receipt .hd { display: flex; gap: 14px; align-items: center; }
.receipt .ok { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); flex: none; }
.receipt h1 { font-size: 22px; margin: 0; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
@media (max-width: 600px) { .keys { grid-template-columns: 1fr; } }
.key { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; background: var(--surface2); position: relative; }
.key.code { background: var(--gold-soft); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.key label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.key .v { display: block; font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--ink); direction: ltr; unicode-bidi: isolate; text-align: start; margin-top: 4px; overflow-wrap: anywhere; }
.key.code .v { font-size: 28px; letter-spacing: .12em; }
.key .btn { margin-top: 10px; }
.next { counter-reset: n; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.next li { display: flex; gap: 12px; font-size: 14px; }
.next li::before { counter-increment: n; content: counter(n); width: 26px; height: 26px; border-radius: 50%; background: var(--navy-soft); color: var(--navy); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; flex: none; }

/* ---------- status ---------- */
.lookup { max-width: 560px; margin: 0 auto; }
.lookup .grid { grid-template-columns: 1fr; }
.st-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.st-head .ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); flex: none; }
.st-head .ref { font-family: var(--mono); font-size: 16px; font-weight: 600; direction: ltr; unicode-bidi: isolate; display: inline-block; margin: 0; line-height: 1.4; }
.st-head .meta { color: var(--muted); font-size: 13px; }
.st-head .end { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 14px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--pend-soft); color: var(--pend); }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.received { background: var(--pend-soft); color: var(--pend); }
.pill.inreview { background: var(--info-soft); color: var(--info); }
.pill.replied { background: var(--gold-soft); color: var(--gold-ink); }
.pill.meeting { background: var(--navy-soft); color: var(--navy); }
.pill.approved, .pill.answered { background: var(--ok-soft); color: var(--ok); }
.pill.rejected { background: var(--bad-soft); color: var(--bad); }
.pill.closed, .pill.withdrawn, .pill.replaced { background: var(--pend-soft); color: var(--pend); }
.pill.urgent { background: var(--bad); color: #fff; }
.pill.urgent::before { background: #fff; }
.track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 18px 0 4px; }
.track .s { position: relative; padding-top: 34px; padding-inline: 4px; text-align: center; font-size: 12.5px; color: var(--muted); }
.track .s::before { content: ''; position: absolute; top: 13px; inset-inline: 0; height: 3px; background: var(--line); }
.track .s:first-child::before { inset-inline-start: 50%; } .track .s:last-child::before { inset-inline-end: 50%; }
.track .s i { position: absolute; top: 2px; inset-inline-start: calc(50% - 13px); width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line2); display: grid; place-items: center; font-style: normal; z-index: 1; }
.track .s.done::before { background: var(--ok); }
.track .s.done i { background: var(--ok); border-color: var(--ok); color: #fff; }
.track .s.now i { border-color: var(--navy); background: var(--navy); color: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--navy) 20%, transparent); }
.track .s.now { color: var(--ink); font-weight: 600; }
.track .s b { display: block; font-weight: inherit; }
.track .s small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
/* dark mode: --navy is light there — white icons, initials and checks get the darker steel blue (6:1) */
@media not all { .action .ic, .reply .av, .track .s.now i { background: #46677c; } .track .s.now i { border-color: #46677c; } }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; margin-top: 16px; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.meet { border-radius: var(--r); padding: 16px; background: linear-gradient(135deg, var(--navy-soft), var(--surface)); border: 1px solid color-mix(in srgb, var(--navy) 25%, var(--line)); }
.meet .when { font-size: 18px; font-weight: 600; margin: 4px 0; }
.meet .mode { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink2); }
.meet .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.reply { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.reply:first-of-type { border-top: 0; padding-top: 4px; }
.reply .av { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.reply .who { font-size: 13px; color: var(--muted); }
.reply .who b { color: var(--ink); font-weight: 600; }
.reply .txt { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
/* free text (replies, notes, history) takes the direction of its own words, paragraph by paragraph */
.reply .txt, .tl li q, .meet .pre { unicode-bidi: plaintext; text-align: start; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ''; position: absolute; top: 8px; bottom: 8px; inset-inline-start: 7px; width: 2px; background: var(--line); }
.tl li { position: relative; padding-inline-start: 26px; padding-bottom: 14px; font-size: 13.5px; }
.tl li::before { content: ''; position: absolute; inset-inline-start: 2px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--blue); }
.tl li.k-followup::before { border-color: var(--bad); } .tl li.k-reply::before, .tl li.k-meeting::before { border-color: var(--gold); } .tl li.k-closed::before { border-color: var(--ok); background: var(--ok); }
.tl li b { display: block; font-weight: 600; }
.tl li span { display: block; color: var(--muted); font-size: 12.5px; }
.tl li q { display: block; color: var(--ink2); quotes: none; overflow-wrap: anywhere; }
.closedbar { display: flex; gap: 12px; align-items: center; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 13.5px; }
.facts-l { display: grid; gap: 8px; font-size: 13.5px; }
.facts-l div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.facts-l div:last-child { border-bottom: 0; padding-bottom: 0; }
.facts-l span { color: var(--muted); } .facts-l b { font-weight: 500; text-align: end; overflow-wrap: anywhere; }

/* ---------- dialog, toast ---------- */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: rgba(15, 25, 35, .5); backdrop-filter: blur(2px); }
dialog .dh { display: flex; gap: 12px; align-items: flex-start; padding: 18px 18px 6px; }
dialog .dh .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); flex: none; }
dialog .dh h2 { margin: 0; font-size: 17px; }
dialog .dh p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
dialog .db { padding: 8px 18px 4px; font-size: 14px; overflow: auto; }
dialog .df { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 18px 18px; }
dialog.wide { width: min(820px, calc(100vw - 32px)); }
.ax-g h4 { margin: 14px 0 6px; font-size: 14px; color: var(--navy); }
.ax-g ul { margin: 0; padding-inline-start: 20px; font-size: 13.5px; } .ax-g li { margin: 3px 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.15); }
/* centred by its margins between the two 16 px gutters: on a phone it may use the whole width */
.toast { position: fixed; bottom: 20px; left: 16px; right: 16px; margin-inline: auto; width: fit-content; max-width: 560px; transform: translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: .2s; z-index: 100; }
.toast.on { opacity: 1; transform: none; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: rot .8s linear infinite; display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- footer ---------- */
footer { border-top: 1px solid var(--line); background: var(--surface); margin-top: 30px; }
footer .wrap { display: flex; gap: 10px 24px; flex-wrap: wrap; align-items: center; padding-top: 18px; padding-bottom: 18px; font-size: 13px; color: var(--muted); }
footer .end { margin-inline-start: auto; display: flex; gap: 16px; flex-wrap: wrap; }
footer a { color: var(--muted); }

@media print {
  .top, footer, .devbar, .noprint, .toast { display: none !important; }
  body { background: #fff; }
  .panel { box-shadow: none; border-color: #ccc; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- about box (home) and How to use page ---------- */
.rule.about { margin-top: 22px; border-color: color-mix(in srgb, var(--navy) 25%, var(--line)); background: var(--navy-soft); }
.rule.about .ic { background: var(--navy); color: #fff; }
.rule.about a { color: var(--navy); font-weight: 600; }
.guide-head, .guide-intro { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; }
.guide-head .guide-link { border-color: var(--blue); }
.guide-intro { margin: 8px 0 16px; }
.guide-intro .desc { margin: 0; }
.help h1 { font-size: clamp(22px, 3.4vw, 30px); margin: 4px 0; color: var(--navy2); }
.help-steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 14px; }
.help-step { display: flex; gap: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.help-n { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.help-b { min-width: 0; flex: 1; }
.help-b h2 { margin: 4px 0 6px; font-size: 17px; color: var(--ink); }
.help-b p { margin: 0 0 10px; color: var(--ink2); }
.help-img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.help-notes { margin-top: 16px; }
.help-notes h2 { margin: 0 0 8px; font-size: 18px; }
.help-notes ul { margin: 0; padding-inline-start: 20px; }
.help-notes li { margin: 6px 0; color: var(--ink2); }
.help-svcs { margin-top: 16px; }
.help-svcs h2 { margin: 0 0 4px; font-size: 18px; }
.help-svcs dl { margin: 10px 0 0; display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px 16px; }
.help-svcs dt { font-weight: 600; color: var(--ink); }
.help-svcs dd { margin: 0; color: var(--ink2); }
.help-files { display: block; margin-top: 3px; font-size: 13px; color: var(--ink3, var(--ink2)); }
@media (max-width: 640px) { .help-svcs dl { grid-template-columns: 1fr; gap: 2px; } .help-svcs dd { margin-bottom: 10px; } }
.help-cta { margin: 18px 0 32px; }
.note.upfirst { font-weight: 500; }
/* Documents returned by DCD and meeting minutes on the status page. */
.minutes-title { margin: 0 0 8px; font-size: 1rem; }
.dcd-file { flex-wrap: wrap; gap: 10px; }
.dcd-file .nm { min-width: 0; overflow-wrap: anywhere; }

/* 3.0.9 responsibilities, illustrated guide and narrow layouts. */
.responsibility { border: 1px solid var(--line2); border-inline-start: 4px solid var(--blue); border-radius: var(--r); background: var(--navy-soft); padding: 16px 18px; margin-bottom: 16px; }
.responsibility h2 { font-size: 17px; margin: 0 0 6px; }
.responsibility p { margin: 6px 0; }
.responsibility a { display: inline-block; margin-top: 6px; font-weight: 600; }
.card .service-who { color: var(--ink2); border-top: 1px solid var(--line); padding-top: 8px; }
.help-jumps, .word-template { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
.word-template { padding: 14px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--surface2); }
.word-template > div { flex: 1 1 240px; min-width: 0; }
.word-template p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.help-event { margin-top: 16px; }
.help-event > h2 { margin-bottom: 12px; }
.event-step { display: flex; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); }
.help-figure { display: block; max-width: min(100%, 620px); margin: 12px 0 0; padding: 0; border: 0; background: transparent; text-align: start; color: var(--navy); font-weight: 600; cursor: zoom-in; }
.help-figure span { display: block; margin-top: 6px; text-decoration: underline; }
.help-zoom { overflow: auto; max-height: 60vh; }
.help-zoom img { display: block; max-width: none; height: auto; }
.help-svcs dd > p { margin: 0 0 8px; }
.help-svcs dd { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.help-svcs dd > a { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; }
[id^="guide-"] { scroll-margin-top: 90px; }
.main-col, .side, .side .svc > div, .rule > div, .reply > div, .action > span:not(.ic), .help-b { min-width: 0; }
.btn { max-width: 100%; white-space: normal; line-height: 1.45; padding-block: 8px; text-align: center; overflow-wrap: break-word; }
.chip { white-space: normal; }
.card, .rule, .note, .responsibility, .help-b, .word-template { overflow-wrap: break-word; }
.field input, .field select, .field textarea, .list .cells > div { min-width: 0; max-width: 100%; }
.top nav { flex-shrink: 0; }
.st-head .ref { overflow-wrap: anywhere; }
.file .nm b { white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .top .wrap { gap: 6px; padding-inline: 12px; }
  .top nav { gap: 0; }
  .top nav a, .top nav button { padding-inline: 8px; }
  .brand { gap: 7px; }
  .brand .mark { width: 30px; height: 32px; }
  .brand .t b { font-size: 13px; white-space: normal; }
  .panel { padding: 14px; }
  .help-step, .event-step { display: block; padding: 12px; }
  .help-n { margin-bottom: 8px; }
  .help-b h2 { font-size: 16px; }
  .tplbox .bt, .word-template, .navrow .end { gap: 8px; }
  .word-template > .btn, .word-template > a, .help-jumps > a { width: 100%; }
  .drop { align-items: flex-start; padding: 12px; }
  .action { gap: 10px; padding: 16px; }
  .action .ic { width: 40px; height: 40px; }
  .responsibility { padding: 12px; }
}

/* SPEC322: shared submission notices and the Special Approval reminder. */
.submission-notice { border: 1px solid var(--gold); border-inline-start-width: 3px; margin-block: 14px; }
.submission-notice h2 { margin: 0 0 6px; font-size: 15px; }
.submission-notice p { margin: 6px 0 0; }
.sa-note { color: var(--bad); font-weight: 700; overflow-wrap: anywhere; }
.card .sa-note { font-size: 13px; line-height: 1.55; }
.main-col > .sa-note { margin-bottom: 14px; }

/* (18 Nov 2026) maintenance notice on every page (PORTAL_CONFIG.maintenance) */
#maintbar { background: var(--bad-soft); border-bottom: 2px solid var(--bad); color: var(--ink); }
#maintbar .wrap { display: flex; gap: 10px; align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
#maintbar .wrap > .i { color: var(--bad); flex: none; margin-top: 2px; }
#maintbar b { display: block; color: var(--bad); font-size: 15px; }
#maintbar span { display: block; font-size: 13.5px; line-height: 1.6; }
.maint-box { margin: 18px 0; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); border-inline-start-width: 4px; font-size: 14px; }
.maint-box > strong { font-size: 15px; }

/* (18 Nov 2026) company requests (trade licence number = company code) */
.co-list { display: grid; gap: 6px; }
.co-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 13.5px; }
.co-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.co-main span { overflow-wrap: anywhere; }
.co-row .mono { font-size: 12.5px; }
.note.co-code { margin-top: 12px; }

.topic-options {min-inline-size:0; margin:0; padding:0; border:0}
.topic-options legend {font-weight:600}
.topic-options .field {margin-inline-start:1.5rem}

  {id:"stamp", code:"MS", to:INBOX.projects, en:"Missing Stamp", ar:"ختم مفقود", icon:"stamp",
    subject:["appNo","project"],
    note:{tone:"info", html:true,
      en:"<b class='h'>How to avoid a missing stamp</b>The DCD stamp is applied <b>automatically</b> by the system — it is not placed by hand. The system reads the page size and layout of your file and places the stamp at the same position on every page. Pages that do not match the rest of the file can be missed.<ul><li><b>One page size</b> for the whole file (e.g. all A1 or all A3) — do not mix sizes.</li><li><b>One orientation</b> for all pages (all landscape or all portrait), with every page upright — not rotated.</li><li>Keep each file <b>under 30 MB</b> — the stamp is an image and increases the file size.</li><li>Remove content not required by the UAE FLS Code 2018 — it only adds to the size.</li><li>Upload <b>every page</b> that needs approval — pages that are not uploaded are not reviewed and cannot be stamped.</li></ul>",
      ar:"<b class='h'>كيف تتجنب فقدان الختم</b>يُوضع ختم الدفاع المدني <b>آلياً</b> بواسطة النظام — ولا يُوضع يدوياً. يقرأ النظام مقاس صفحات ملفك وتخطيطها ويضع الختم في نفس الموضع على كل صفحة، لذا قد لا تُختم الصفحات المختلفة عن بقية الملف.<ul><li><b>مقاس صفحة واحد</b> للملف كاملاً (مثلاً كلها A1 أو كلها A3) — لا تخلط المقاسات.</li><li><b>اتجاه واحد</b> لجميع الصفحات (كلها أفقية أو كلها عمودية)، وكل صفحة معتدلة — غير مُدارة.</li><li>اجعل حجم كل ملف <b>أقل من 30 ميغابايت</b> — الختم صورة ويزيد حجم الملف.</li><li>احذف المحتوى غير المطلوب في كود الإمارات 2018 — فهو يزيد الحجم فقط.</li><li>ارفعوا <b>جميع الصفحات</b> المطلوب اعتمادها — الصفحات غير المرفوعة لا تُراجع ولا يمكن ختمها.</li></ul>"},
    blocks:[
      {when:{f:"stampCase", in:["Not uploaded"]},
        en:"<b class='h'>Please submit a new application.</b>Pages that were not uploaded with the approved submission were not reviewed, so they cannot be stamped. Submit a new application in the system and attach:<ul><li>An <b>undertaking letter</b> stating which pages were not uploaded and why.</li><li>The <b>final approval letter</b> of the approved application.</li><li><b>Only the pages</b> that were not uploaded — not the full set of drawings.</li></ul>For the fees of the new application, please contact the Finance Department at <b>Fddcd@dcd.gov.ae</b>.",
        ar:"<b class='h'>يرجى تقديم طلب جديد.</b>الصفحات التي لم تُرفع مع التقديم المعتمد لم تُراجع، لذا لا يمكن ختمها. قدّموا طلباً جديداً في النظام وأرفق:<ul><li><b>خطاب تعهد</b> يوضح الصفحات التي لم تُرفع وسبب ذلك.</li><li><b>خطاب الاعتماد النهائي</b> للطلب المعتمد.</li><li><b>الصفحات المعنية فقط</b> — وليس كامل المخططات.</li></ul>بخصوص رسوم الطلب الجديد، يرجى التواصل مع الإدارة المالية على <b>Fddcd@dcd.gov.ae</b>."},
      {when:[{f:"stampCase", in:["Uploaded"]},{f:"stampAge", in:["More than 5 days"]}],
        en:"<b class='h'>More than 5 days have passed — please submit a new application.</b>Missing stamps reported more than 5 days after the final approval are handled through a new application. Submit a new application in the system and attach:<ul><li>An <b>undertaking letter</b> stating which pages did not receive the stamp.</li><li>The <b>final approval letter</b> of the approved application.</li><li><b>Only the pages</b> that did not receive the stamp — not the full set of drawings.</li></ul>For the fees of the new application, please contact the Finance Department at <b>Fddcd@dcd.gov.ae</b>.",
        ar:"<b class='h'>مضى أكثر من 5 أيام — يرجى تقديم طلب جديد.</b>تُعالج الأختام المفقودة المبلّغ عنها بعد أكثر من 5 أيام من الاعتماد النهائي من خلال طلب جديد. قدّموا طلباً جديداً في النظام وأرفق:<ul><li><b>خطاب تعهد</b> يوضح الصفحات التي لم تُختم.</li><li><b>خطاب الاعتماد النهائي</b> للطلب المعتمد.</li><li><b>الصفحات غير المختومة فقط</b> — وليس كامل المخططات.</li></ul>بخصوص رسوم الطلب الجديد، يرجى التواصل مع الإدارة المالية على <b>Fddcd@dcd.gov.ae</b>."}
    ],
    decl:[{id:"dStampPages", en:"The pages listed were uploaded with the approved submission and did not receive the DCD stamp.", ar:"الصفحات المذكورة رُفعت مع التقديم المعتمد ولم تحصل على ختم الدفاع المدني."}],
    sections:[
      {en:"Missing stamp", ar:"الختم المفقود", fields:[
        {id:"stampCase", en:"Were the pages uploaded with the approved submission?", el:"Pages uploaded", ar:"هل رُفعت الصفحات مع التقديم المعتمد؟", type:"cards", req:true, full:true,
          options:[["Uploaded","نعم — رُفعت ولم تُختم","Yes — uploaded, but not stamped","The pages are in the approved submission without the stamp","الصفحات موجودة في التقديم المعتمد بدون ختم"],
                   ["Not uploaded","لا — لم تُرفع","No — the pages were not uploaded","Pages missing from the approved submission","صفحات غير موجودة في التقديم المعتمد"]]},
        {id:"stampAge", en:"When was the final approval issued?", el:"Reported", ar:"متى صدر الاعتماد النهائي؟", type:"cards", req:true, full:true, when:{f:"stampCase", in:["Uploaded"]},
          options:[["Within 5 days","خلال 5 أيام أو أقل","5 days ago or less","An email can be sent to the department","يمكن إرسال بريد إلى الإدارة"],

      {en:"Approved application", ar:"الطلب المعتمد", when:[{f:"stampCase", in:["Uploaded"]},{f:"stampAge", in:["Within 5 days"]}], fields:[
        F.appNo({en:"Approved application number", ar:"رقم المعاملة المعتمد"}), F.project(),

        {id:"approvalDate", en:"Final approval date", ar:"تاريخ الاعتماد النهائي", type:"date", req:true}

        note:{en:"List each page that did not receive the stamp (up to 10).",ar:"اذكر كل صفحة لم تحصل على الختم (حتى 10)."}, fields:[

          {id:"title", en:"Drawing title", ar:"عنوان المخطط", req:false, w:"1.6fr"}

        {id:"stampReason", en:"Likely reason the stamp was not applied", el:"Likely reason", ar:"السبب المحتمل لعدم وضع الختم", type:"select", req:true, full:true,
          options:[["Different page size from the rest of the file","مقاس صفحة مختلف عن بقية الملف"],["Different page orientation (rotated / portrait vs landscape)","اتجاه صفحة مختلف (مُدارة / عمودية وأفقية)"],["File size over 30 MB","حجم الملف أكبر من 30 ميغابايت"],["Not known","غير معروف"],["Other","أخرى"]]},
        F.details({id:"stampWhy", en:"Explain what happened", el:"Explanation", ar:"وضّحوا ما حدث", ph:{en:"e.g. Pages 12–14 are A1 while the rest of the file is A3",ar:"مثال: الصفحات 12–14 بمقاس A1 وبقية الملف A3"}}),
        F.oneDrive({req:false, help:{en:"Optional — a folder with the approved file and the final approval letter.",ar:"اختياري — مجلد يحتوي الملف المعتمد وخطاب الاعتماد النهائي."}})
      ]}
    ]},

  {id:"temporary", code:"TP", to:INBOX.projects, en:"Temporary Project", ar:"مشروع مؤقت", icon:"temporary", tag:{en:"Up to 6 months",ar:"حتى 6 أشهر"},
    subject:["tpType","project"],
    note:{tone:"info", html:true,
      en:"<b class='h'>Temporary projects fall under Projects & Infrastructure.</b>The UAE FLS Code 2018 defines <b>temporary</b> as a duration of <b>six months (180 days)</b> — Chapter 12, §1.2.2. Requirements for temporary offices, accommodation and storage sheds are in Chapter 12, Table 12.3 (items 4, 5 and 8), and the material test standards are in Chapter 1, Section 7 (§7.1.40 – §7.1.46).<ul><li><b>6 months or less:</b> send the project details here, with an editable OneDrive link containing the documents listed below.</li><li><b>More than 6 months:</b> submit an application in the system.</li><li><b>Hazardous storage</b> (Group A, Table 1.1): the consultant must submit through the DCD portal.</li><li>Temporary structures for <b>events</b> are handled by the Events Department (events@dcd.gov.ae).</li></ul><div class='nbtns'><button type='button' class='btn btn-s' data-annex='temporary' style='min-height:40px'>Code requirements for temporary projects</button></div>",
      ar:"<b class='h'>المشاريع المؤقتة تندرج ضمن المشاريع والبنية التحتية.</b>يعرّف كود الإمارات 2018 <b>المؤقت</b> بأنه مدة <b>ستة أشهر (180 يوماً)</b> — الفصل 12، البند 1.2.2. متطلبات المكاتب والسكن ومخازن المواقع المؤقتة واردة في الفصل 12، الجدول 12.3 (البنود 4 و5 و8)، ومعايير فحص المواد في الفصل 1، القسم 7 (البنود 7.1.40 – 7.1.46).<ul><li><b>6 أشهر أو أقل:</b> أرسلوا بيانات المشروع من هنا مع رابط OneDrive قابل للتعديل يحتوي المستندات المذكورة أدناه.</li><li><b>أكثر من 6 أشهر:</b> قدّموا طلباً في النظام.</li><li><b>التخزين الخطر</b> (المجموعة A، الجدول 1.1): يجب أن يقدمه الاستشاري عبر بوابة الدفاع المدني.</li><li>المنشآت المؤقتة <b>للفعاليات</b> تتولاها إدارة الفعاليات (events@dcd.gov.ae).</li></ul><div class='nbtns'><button type='button' class='btn btn-s' data-annex='temporary' style='min-height:40px'>متطلبات الكود للمشاريع المؤقتة</button></div>"},
    blocks:[
      {when:{f:"tpDuration", in:["More than 6 months"]},
        en:"<b class='h'>More than 6 months is not temporary — please submit an application in the system.</b>The UAE FLS Code 2018 limits “temporary” to six months (180 days) — Chapter 12, §1.2.2. Submit an application under Projects & Infrastructure, following Annexure 2 of the code.",
        ar:"<b class='h'>المدة التي تزيد عن 6 أشهر لا تُعد مؤقتة — يرجى تقديم طلب في النظام.</b>يحدد كود الإمارات 2018 «المؤقت» بستة أشهر (180 يوماً) — الفصل 12، البند 1.2.2. قدّموا طلباً ضمن المشاريع والبنية التحتية وفق الملحق رقم 2 من الكود.", ax:"infrastructure"},
      {when:[{f:"tpDuration", in:["6 months or less"]},{f:"tpType", in:["Temporary event structure"]}],
        en:"<b class='h'>Temporary structures for events are handled by the Events Department.</b>Please email events@dcd.gov.ae directly and follow their process.",
        ar:"<b class='h'>المنشآت المؤقتة للفعاليات تتبع إدارة الفعاليات.</b>يرجى مراسلة events@dcd.gov.ae مباشرة واتباع إجراءاتهم.", ax:"events"},
      {when:[{f:"tpDuration", in:["6 months or less"]},{f:"tpType", in:["Temporary storage shed"]},{f:"tpHazard", in:["Group A"]}],
        en:"<b class='h'>Hazardous storage must be submitted by the consultant through the DCD portal.</b>Group A materials in Table 1.1 of the UAE FLS Code 2018 — such as explosives, fireworks, oxidizers, flammable or combustible liquids and gases, aerosols, combustible dust, corrosive or toxic materials, perfumes, plastic products and tires — are high-hazard storage. This cannot be handled by email: the project consultant must submit an application through the DCD portal.",
        ar:"<b class='h'>التخزين الخطر يقدمه الاستشاري عبر بوابة الدفاع المدني.</b>مواد المجموعة A في الجدول 1.1 من كود الإمارات 2018 — مثل المتفجرات والألعاب النارية والمواد المؤكسدة والسوائل والغازات القابلة للاشتعال والبخاخات والغبار القابل للاشتعال والمواد الأكالة أو السامة والعطور والمنتجات البلاستيكية والإطارات — تخزين عالي الخطورة. لا يمكن معالجته بالبريد: يجب أن يقدم استشاري المشروع طلباً عبر بوابة الدفاع المدني.", ax:"temporary"}

        {h:"Temporary enclosures — Table 12.3, item 5", items:["Non-combustible panels, flame-resistant tarpaulins or approved equivalent.","Other fabrics and plastic films certified to NFPA 701, Test Method 2.","Fastened securely so they cannot blow against heaters or ignition sources.","At least one suitable fire extinguisher in each enclosure (Chapter 4)."]},

        {h:"Material test certificates — Chapter 1, Section 7", items:["Modular homes / offices (§7.1.46): Class B to ASTM E84 or UL 723, or Limited Combustible to FM 4880.","Tents (§7.1.42): Class A to NFPA 701, EN 13501-1, ASTM E84, UL 723 or BS 476 Part 7.","Membrane structures (§7.1.41): Class A to ASTM E84, UL 723, BS 476 Part 7, EN 13501-1 or NFPA 701.","Air-inflated / air-supported structures (§7.1.43): designed and operated to ASCE/SEI 17.","Kiosks (§7.1.40): Class A — particleboard Type PBU to ANSI A208.1 (min. 6.4 mm), foamed plastics ≤ 100 kW to UL 1975 or NFPA 289, textiles to NFPA 701, or metal composite panels to §7.1.24."]},
        {h:"Hazardous storage — Table 1.1 (consultant through the DCD portal)", red:true, items:["Group A-1: explosives, detonators, pyrophoric, unstable (reactive) materials, organic peroxides, oxidizers, fireworks.","Group A-2: aerosols, combustible and flammable liquids, combustible fibre and dust, pyrotechnics, cryogenic, flammable and oxidizing gases, flammable solids, water-reactive, corrosive and toxic materials, perfumes, baled cotton, plastic products, tires.","Storage of these materials must be submitted by the project consultant through the DCD portal — not by email."]}

<script>'use strict';
/* Portal additions on top of the e-mail generator's config.js. config.js itself is copied unchanged, so both sites keep
   the same wording and the same UAE FLS Code references; everything that differs for the portal is here:
   uploads (PDF), the engineer to route to, the comment on Application Status, Special Approval documents, Events online,
   and the portal's own confirmations. */
const PORTAL = (() => {
  const cat = id => CONFIG.CATEGORIES.find(c => c.id === id);
  /* od: a OneDrive link can be given instead of this upload (the upload messages then say so) */
  const file = (id, en, ar, o = {}) => ({ id, type: 'file', en, ar, req: true, full: true, max: 3, ...o });
  const eng = (o = {}) => F.engineer({
    id: 'portalEng', req: false,
    en: 'DCD engineer handling your application (if known)', ar: 'مهندس الدفاع المدني المسؤول عن طلبكم (إن كان معروفاً)',
    help: { en: 'Optional. The department uses this name to route your request when a matching engineer is available.', ar: 'اختياري. تستخدم الإدارة هذا الاسم لتوجيه الطلب إلى المهندس المعني عند تطابق الاسم وتوفّره.' }, ...o });
  /* (16 Nov 2026, Mohamed) every service's main documents must be uploaded, so they reach Admin Ledger / Review Ledger;
     a OneDrive link is only an optional extra, never instead of the uploads */
  const odExtra = { en: 'Optional, in addition to the uploads above — one folder shared with “Can edit”.', ar: 'اختياري، إضافةً إلى الملفات المرفوعة أعلاه — مجلد واحد بصلاحية «يمكن التعديل».' };

  /* ---- Your details: the owner is kept with the request (there is no e-mail to copy them on) ---- */
  Object.assign(CONFIG.SENDER[1], { en: 'Project owner', ar: 'مالك المشروع', note: { tone: 'info', html: true,
    en: "<b class='h'>Enter the project owner’s details (or the owner’s representative).</b>The department keeps them with your request and may contact the owner about it.",
    ar: "<b class='h'>أدخلوا بيانات مالك المشروع (أو ممثل المالك).</b>تحتفظ الإدارة بهذه البيانات مع طلبكم، وقد تتواصل مع المالك بشأنه." } });
  /* the role hint: there is no e-mail here, so the owner is not "copied" — the owner's details are the next section */
  const role = CONFIG.SENDER[0].fields.find(f => f.id === 'role');
  if (role) role.info = {
    en: ['Only the consultant or the contractor of the project submits the request.', 'The project owner’s details are entered in the next section.'],
    ar: ['يقدّم الطلب استشاري المشروع أو مقاوله فقط.', 'تُدخل بيانات مالك المشروع في القسم التالي.'] };

  const eventTime = s => String(s).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const validTime = s => /^([01]?\d|2[0-3]):[0-5]\d$/.test(eventTime(s));
  const eventWebsite = /^https:\/\/[^\s"'<>\\]+$/i;

  /* ---- Application Status: the client's own message, and the engineer for a new submission ---- */
  const as = cat('status');
  as.sections[1].fields.push(
    eng({ when: { f: 'appStage', in: ['New submission'] } }),
    F.details({ id: 'asComment', req: false, el: 'Message', en: 'Your message to the department', ar: 'رسالتكم إلى الإدارة',
      ph: { en: 'e.g. Submitted on 20 Oct — please advise what is still pending.', ar: 'مثال: قُدّم في 20 أكتوبر — يرجى إفادتنا بما هو مطلوب.' } }),
    file('asFiles', 'Supporting document (PDF, optional)', 'مستند داعم (PDF، اختياري)', { req: false, max: 2,
      help: { en: 'For example the DCD comment or a screenshot of the status in the system.', ar: 'مثل ملاحظة الدفاع المدني أو صورة لحالة الطلب في النظام.' } }));

  /* ---- General Inquiry: a sketch or an extract of the drawing can be uploaded with the questions ---- */
  const giQ = cat('general').sections.find(s => s.fields.some(f => f.id === 'questions'));
  giQ.fields.splice(giQ.fields.findIndex(f => f.id === 'oneDrive'), 0,
    file('giFiles', 'Drawing extract or sketch (PDF, optional)', 'مقتطف من المخطط أو رسم توضيحي (PDF، اختياري)', { req: false,
      help: { en: 'Only the part of the drawing your questions are about.', ar: 'الجزء الذي يتعلق بأسئلتكم من المخطط فقط.' } }));

  /* ---- Meeting Request: the engineer's comment can be uploaded instead of a OneDrive link ---- */
  const mr = cat('meeting');
  const mrFiles = mr.sections.find(s => s.fields.some(f => f.id === 'oneDrive'));
  const needSupport = v => v.reqByEng === 'Yes' || v.mAbout === 'Unclear comment';
  mrFiles.fields = [
    file('mFiles', 'Engineer’s comment or email (PDF)', 'ملاحظة المهندس أو بريده (PDF)', { req: false, reqIf: v => needSupport(v),
      help: { en: 'Required when the engineer requested the meeting or for an unclear comment.', ar: 'إلزامي إذا طلب المهندس الاجتماع أو للملاحظة غير الواضحة.' } }),
    F.oneDrive({ req: false, help: odExtra })];

  const field = (id, en, ar, extra = {}) => ({id, en, ar, type:'text', req:true, ...extra});
  const projectType = field('projectType', 'Type of project', 'نوع المشروع', {type:'select',
    options:[['Consultant','مشروع استشاري'], ['Decor','أعمال الديكور'], ['Gas','أعمال الغاز']]});
  const topics = [['Fire & Life Safety','السلامة من الحريق وسلامة الأرواح'], ['Smoke management','إدارة الدخان'],
    ['Fire fighting','مكافحة الحريق'], ['Fire alarm','إنذار الحريق'], ['Exit & emergency lighting','إنارة المخارج والطوارئ'],
    ['LPG','غاز البترول المسال'], ['Infrastructure','البنية التحتية'], ['Marine','الأعمال البحرية'], ['Other','أخرى']];
  const sharedFiles = F.oneDrive({maxLength:1000, help:{
    en:'Share one folder containing the files and choose “Can edit”.', ar:'شاركوا مجلداً واحداً يضم الملفات واختاروا صلاحية «يمكن التعديل».'},
    check:v => /^https:\/\/(?:1drv\.ms|onedrive\.live\.com|(?:[a-z0-9-]+\.)+(?:sharepoint|onedrive)\.com)\/[^\s"'<>\\]+$/i.test(v.oneDrive.trim()) ? null :
      {en:'Enter a OneDrive or SharePoint sharing link.', ar:'أدخلوا رابط مشاركة من OneDrive أو SharePoint.'}});
  const measurement = s => String(s).trim().replace(/٫/g, '.')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const dimension = (id, en, ar) => F.num(id, en, ar, {req:false, reqIf:v => v.section === 'Buildings & Facilities',
    normalise:measurement, check:v => {
      const n = measurement(v[id]);
      return /^\d+(?:\.\d+)?$/.test(n) && Number(n) > 0 ? null : {en:'Enter a positive measurement.', ar:'أدخلوا قياساً أكبر من صفر.'};
    }});
  const project = fields => ({en:'Project details', ar:'بيانات المشروع', fields});
  const fc = cat('facade');
  Object.assign(fc, {en:'Façades and cladding', ar:'الواجهات والتكسيات', note:null, declOnly:['dLink','dPortal','dTrue'],
    sections:[project([F.project(), F.plot(), F.appNo({req:false}),
      field('scope','Scope of façade or cladding work','نطاق أعمال الواجهات والتكسيات',{full:true}), sharedFiles])]});
  const sa = cat('special');
  Object.assign(sa, {en: 'Special approval request', ar: 'طلب موافقة خاصة'});
  sa.submissionNote = {
    en: "Please use this form to submit your special approval request, even if you previously contacted the department by email.",
    ar: "يرجى تقديم طلب الموافقة الخاصة عبر هذا النموذج، حتى لو سبق أن راسلتم الإدارة بالبريد الإلكتروني." };
  Object.assign(sa, {subject:['appNo'], note:null, declOnly:['dLink','dPortal','dTrue'], sections:[
    project([F.project(), F.plot(), F.appNo(), field('applicationType','Application type','نوع المعاملة'), projectType,

      tplBusy: 'خدمة النماذج مشغولة — يرجى المحاولة بعد دقائق.',
    },
  };
  const t = (k, vars) => {
    let s = TX[lang][k]; if (s == null) s = TX.en[k]; if (s == null) s = k;
    if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, n) => (vars[n] != null ? vars[n] : ''));
    return s;
  };
  /* a counted noun after a preposition ("up to", "in"): English 1 file / 3 files; Arabic ملف واحد · ملفين · 3 ملفات ·
     11 ملفاً · 100 ملف — and دقيقة واحدة · دقيقتين · 5 دقائق · 15 دقيقة */
  const NOUNS = { file: { en: ['file', 'files'], ar: ['ملف واحد', 'ملفين', 'ملفات', 'ملفاً', 'ملف'] }, minute: { en: ['minute', 'minutes'], ar: ['دقيقة واحدة', 'دقيقتين', 'دقائق', 'دقيقة', 'دقيقة'] } };
  function counted(kind, n) {
    const w = NOUNS[kind];
    if (lang !== 'ar') return n + ' ' + w.en[n === 1 ? 0 : 1];
    const r = n % 100;
    if (n === 1) return w.ar[0];
    if (n === 2) return w.ar[1];
    if (r >= 3 && r <= 10) return n + ' ' + w.ar[2];
    if (r >= 11 && r <= 99) return n + ' ' + w.ar[3];
    return n + ' ' + w.ar[4];
  }
  const locale = () => (lang === 'ar' ? 'ar-AE-u-nu-latn' : 'en-GB');
  // "ص" / "م" (and AM / PM) stay on the line of their time: after a normal space they can wrap alone on a phone
  const keepPeriod = s => s.replace(/\s+(?=(?:ص|م|AM|PM|am|pm)(?:\s|$))/gu, ' ');
  const fmt = (iso, o = {}) => {
    if (!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return String(iso);
    return keepPeriod(new Intl.DateTimeFormat(locale(), { timeZone: 'Asia/Dubai', day: 'numeric', month: 'short', year: 'numeric', ...(o.time === false ? {} : { hour: '2-digit', minute: '2-digit' }), ...(o.weekday ? { weekday: 'short' } : {}) }).format(d));
  };
  const fmtDay = iso => { if (!iso) return ''; const d = new Date(iso + (String(iso).length === 10 ? 'T00:00:00+04:00' : '')); return isNaN(d) ? iso : new Intl.DateTimeFormat(locale(), { timeZone: 'Asia/Dubai', day: 'numeric', month: 'short', year: 'numeric' }).format(d); };

  /* ---------------- state (memory only) ---------------- */
  /* a random token per form fill: a submit sent again because its answer never arrived gets the same request back */
  const newToken = () => { const b = new Uint8Array(16); crypto.getRandomValues(b); return Array.from(b, x => x.toString(16).padStart(2, '0')).join(''); };
  const S = { cat: null, step: 1, v: {}, files: {}, decl: {}, t0: Date.now(), hp: '', busy: false, receipt: false,
    tpl: null, tplAt: 0, tplFail: false, tplFiles: {}, token: newToken(), pending: null, ambiguous: false };
  // The service limits uploads by page session.
  const SID = (() => { const b = new Uint8Array(8); crypto.getRandomValues(b); return Array.from(b, x => x.toString(16).padStart(2, '0')).join(''); })();
  const catById = id => CONFIG.CATEGORIES.find(c => c.id === id);
  const cur = () => (S.cat ? catById(S.cat) : null);
  // a DCD HQ walk-in visitor names no project owner (the service does not ask for one either)
  // the walk-in (DCD HQ General) asks only the visitor's own details, and the visitor may also be the owner or another person
  // an event comes from its organiser (no consultant/contractor, no project owner)
  const senderSecs = () => { const cat = (typeof S !== 'undefined' && S) ? S.cat : null; return catById(cat)?.sender || (cat === 'hq' ? [PORTAL.HQ_SENDER] : cat === 'event' ? [PORTAL.EV_SENDER] : CONFIG.SENDER.slice(0, 2)); };

  /* ---------------- options, visibility, values ---------------- */
  const optList = f => (f.options || []).map(o => (Array.isArray(o) ? { v: o[0], en: o[2] || o[0], ar: o[1] || o[0], hen: o[3] || '', har: o[4] || '' } : { v: o, en: o, ar: o, hen: '', har: '' }));
  const optLabel = (f, v) => { const o = optList(f).find(x => x.v === v); return o ? (lang === 'ar' ? o.ar : o.en) : v; };
  const optHint = (f, v) => { const o = optList(f).find(x => x.v === v); return o ? (lang === 'ar' ? o.har : o.hen) : ''; };

  function model(c) {
    const fmap = new Map();
    (c ? c.sections : []).forEach((sec, si) => sec.fields.forEach(f => { if (f.id) fmap.set(f.id, { f, sec, si }); }));
    const memo = new Map(), busy = new Set();
    const raw = id => (S.v[id] == null ? '' : S.v[id]);
    const val = id => (fmap.has(id) ? (on(id) ? raw(id) : '') : raw(id));
    const test = w => (!w ? true : Array.isArray(w) ? w.every(test) : w.in ? w.in.includes(val(w.f)) : w.nin ? !w.nin.includes(val(w.f)) : true);
    function on(id) {
      if (memo.has(id)) return memo.get(id);
      if (busy.has(id)) return false;
      busy.add(id);
      const e = fmap.get(id);
      const r = e ? test(e.sec.when) && test(e.f.when) : true;
      busy.delete(id); memo.set(id, r); return r;
    }
    const values = () => {
      const v = {};
      for (const sec of senderSecs()) for (const f of sec.fields) v[f.id] = raw(f.id);
      for (const id of fmap.keys()) v[id] = val(id);
      v._files = {};
      for (const [id, e] of fmap) if (e.f.type === 'file') v._files[id] = on(id) ? (S.files[id] || []).filter(x => x.status === 'done').length : 0;
      return v;
    };
    const reqOf = (f, v) => !!(f.req || f.min > 0 || (typeof f.reqIf === 'function' && f.reqIf(v || values())));
    const blocks = () => (c && c.blocks ? c.blocks.filter(b => test(b.when)) : []);
    return { fmap, on, val, test, values, reqOf, blocks };
  }

  /* ---------------- checks ---------------- */
  const normPhone = s => {
    let d = asciiDigits(s).replace(/[^\d+]/g, '');
    d = d.replace(/^00971/, '').replace(/^\+?971/, '').replace(/^\+/, '').replace(/^0/, '');
    return /^5\d{8}$/.test(d) ? `+971 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5)}` : null;
  };
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const okLink = s => {
    try {
      const u = new URL(String(s).trim());
      if (u.protocol !== 'https:') return false;
      const h = u.hostname.toLowerCase();
      return h.endsWith('.sharepoint.com') || h === '1drv.ms' || h === 'onedrive.live.com' || h.endsWith('.onedrive.com');
    } catch (e) { return false; }
  };
  function checkField(f, m, v) {
    const val = S.v[f.id];
    const req = m.reqOf(f, v);
    if (f.type === 'note') return null;
    if (f.type === 'file') {
      const list = S.files[f.id] || [];
      if (list.some(x => x.status === 'checking' || x.status === 'uploading')) return t('fWait');
      if (req && !list.some(x => x.status === 'done')) return t('required');
      return null;
    }
    if (f.type === 'topics') {
      return Array.isArray(val) && val.length && val.every(row => row.type.trim() && row.type.trim().length <= 200) ? null : t('required');
    }
    if (f.type === 'list') {
      const rows = Array.isArray(val) ? val : [];
      const filled = rows.filter(r => f.cols.some(c => String(r[c.id] || '').trim()));
      const min = f.min || (req ? 1 : 0);
      if (filled.length < min) return t('required');
      for (const r of filled) for (const c of f.cols) {
        const x = String(r[c.id] || '').trim();
        if (c.req && !x) return t('required');
        if (x.length > LIM.cell) return t('tooLong', { n: LIM.cell });
      }
      return null;
    }
    const s = String(val == null ? '' : val).trim();
    if (!s) return req ? t('required') : null;
    if (f.type === 'gate') return null;
    if (f.type === 'phone') return normPhone(s) ? null : t('badPhone');
    if (f.type === 'email' && !(f.pattern || EMAIL_RE).test(s)) return t('badEmail');
    if (f.type === 'url' || f.onedrive) { if (s.length > LIM.url || !okLink(s)) return t('badLink'); }
    else if (f.pattern && !f.pattern.test(s)) return t('invalid');
    const max = f.maxLength || (f.type === 'textarea' ? LIM.textarea : LIM.text);
    if (s.length > max) return t('tooLong', { n: max });
    if (typeof f.check === 'function') { const r = f.check(v); if (r) return L(r); }
    return null;
  }

  /* ---------------- rendering helpers ---------------- */
  const app = $('#app');

  function route() {

  /* ---------------- new request ---------------- */
  function renderNew(arg, extra) {
    // a staff member's own QR code (#/new/hq/<6-digit app code>) fills in the staff code, so the request is registered
    // as assisted by them; anything else in the link (e.g. an older card's letter + number) is ignored
    if (arg === 'hq' && extra) {

      return `<li class="st ${cls}"${n === S.step ? ' aria-current="step"' : ''}>${n < S.step ? `<button type="button" class="stb" data-step="${n}">${inner}</button>` : `<span class="stb">${inner}</span>`}</li>`;

  const senderOk = () => { const m = model(null); const v = m.values(); return senderSecs().every(sec => sec.fields.every(f => !checkField(f, m, v))); };

  function stepDetails() {
    const m = model(null), v = m.values();
