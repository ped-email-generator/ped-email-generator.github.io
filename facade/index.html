    return `<div class="panel"><h2 data-focus>${esc(t('steps')[0])}</h2><p class="desc">${cur()?.sender ? '' : esc(t(S.cat === 'hq' ? 'hqSub' : S.cat === 'event' ? 'evSub' : 's1sub'))}</p>${secs}
      <input class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" data-hp value="${esc(S.hp)}">
      <div class="navrow">${guideLink(cur()?.id, 'step')}<div class="end"><button type="button" class="btn primary lg" data-act="next">${esc(t('next'))}${icon('arrow', 'sm flip')}</button></div></div></div>`;
  }

  function noteHtml(n) {
    if (!n) return '';
    const tone = n.tone === 'warn' ? 'warn' : n.tone === 'bad' ? 'bad' : '';
    const h = n.html || /<[a-z]/i.test(L(n)) ? trusted(L(n)) : esc(L(n));
    return `<div class="note ${tone}">${h}</div>`;
  }

  function stepRequest(c) {
    const m = model(c), v = m.values();
    const secs = c.sections.map((sec, si) => `<div class="fsec" data-sec="${si}"><h3>${esc(L(sec))}</h3>${sec.note ? noteHtml(sec.note) : ''}<div class="grid">${sec.fields.map(f => fieldHtml(f, m, v)).join('')}</div></div>`).join('');
    return `<div class="panel"><h2 data-focus>${esc(t('steps')[1])}</h2><p class="desc">${esc(t('s2sub'))}</p>
      ${noteHtml(c.note)}${c.id !== 'hq' && c.sections.some(sec => sec.fields.some(f => f.type === 'file')) ? `<div class="note upfirst" data-upfirst>${esc(t('upFirst'))}</div>` : ''}${c.tplName ? tplBox(c.tplName) : ''}<div data-blocks></div><div class="fsecs">${secs}</div>
      <div class="navrow"><button type="button" class="btn" data-act="back">${icon('back', 'sm flip')}${esc(t('back'))}</button>${guideLink(c.id, 'step')}
        <div class="end"><button type="button" class="btn primary lg" data-act="next">${esc(t('next'))}${icon('arrow', 'sm flip')}</button></div></div></div>`;
  }

  /* every input is described by its hints and its error (aria-describedby); the error text itself is not an alert — the
     toast says what to do, and the first field with an error gets the focus */
  function fieldHtml(f, m, values) {
    if (!f || !f.id) return '';
    const id = f.id, full = f.full || ['textarea', 'list', 'gate', 'note', 'file'].includes(f.type);
    if (f.type === 'note') return `<div class="field full" data-f="${esc(id)}"><div class="note">${trusted(L(f))}</div></div>`;
    const lbl = L(f) || '';
    const required = m.reqOf(f, values);
    const reqMark = required || typeof f.reqIf === 'function'
      ? `<span class="req${required ? '' : ' hidden'}" data-reqmark="${esc(id)}" aria-hidden="true">*</span>` : '';
    const q = f.info ? `<button type="button" class="qbtn" data-q="${esc(id)}" aria-expanded="false" aria-controls="i_${esc(id)}" aria-label="${esc(t('explain') + ': ' + lbl)}">${lang === 'ar' ? '؟' : '?'}</button>` : '';
    const info = f.info ? `<div class="infobox hidden" id="i_${esc(id)}" data-info="${esc(id)}">${(L(f.info) || []).map(p => `<p>${f.infoHtml ? trusted(p) : esc(p)}</p>`).join('')}</div>` : '';
    const help = f.help ? `<div class="hint" id="h_${esc(id)}">${esc(L(f.help))}</div>` : '';
    const helpTop = f.helpTop ? `<div class="hint" id="ht_${esc(id)}">${esc(L(f.helpTop))}</div>` : '';
    const err = `<div class="err" id="e_${esc(id)}" data-err="${esc(id)}"></div>`;
    const described = [f.helpTop ? 'ht_' + id : '', f.help ? 'h_' + id : '', 'e_' + id].filter(Boolean).map(esc).join(' ');
    const ph = f.ph ? ` placeholder="${esc(L(f.ph))}"` : '';
    const v = S.v[id] == null ? '' : S.v[id];
    const common = `id="f_${esc(id)}" data-in="${esc(id)}" aria-describedby="${described}"${f.inputmode ? ` inputmode="${esc(f.inputmode)}"` : ''}${f.ac ? ` autocomplete="${esc(f.ac)}"` : ''}`;
    let input = '';
    switch (f.type) {
      case 'textarea': input = `<textarea class="input" ${common}${ph} maxlength="${f.maxLength || LIM.textarea}">${esc(v)}</textarea>`; break;
      case 'topics': {
        const rows = Array.isArray(v) ? v : [];
        const choices = optList(f).map((o, i) => {
          const row = rows.find(r => r.topic === o.v), name = lang === 'ar' ? o.ar : o.en;
          const label = (lang === 'ar' ? 'نوع الأعمال' : 'Type of work') + ' (' + name + ')';
          return `<label class="gate"><input type="checkbox" data-topic="${esc(o.v)}" aria-controls="topic_${i}"${row ? ' checked' : ''}><span>${esc(name)}</span></label>
            <label id="topic_${i}" class="field${row ? '' : ' hidden'}"><span>${esc(label)}</span><input class="input" data-topic-type="${esc(o.v)}" aria-required="true" maxlength="200" value="${esc(row?.type || '')}"></label>`;
        }).join('');
        return `<fieldset class="field full topic-options" data-f="${id}"><legend>${esc(lbl)} ${reqMark}</legend>${choices}${err}</fieldset>`;
      }
      case 'radio': {
        input = `<div role="radiogroup" aria-label="${esc(lbl)}">${optList(f).map(o => `<label class="gate"><input type="radio" name="${esc(id)}" data-in="${esc(id)}" value="${esc(o.v)}"${o.v === v ? ' checked' : ''}><span>${esc(lang === 'ar' ? o.ar : o.en)}</span></label>`).join('')}</div>`;
        break;
      }
      case 'select': case 'cards': {
        const opts = optList(f).map(o => `<option value="${esc(o.v)}"${o.v === v ? ' selected' : ''}>${esc(lang === 'ar' ? o.ar : o.en)}</option>`).join('');
        input = `<select class="select" ${common}><option value="">${esc(t('select'))}</option>${opts}</select>` +
          (f.type === 'cards' ? `<div class="ohint${optHint(f, v) ? '' : ' hidden'}" data-ohint="${esc(id)}">${esc(optHint(f, v))}</div>` : '');
        break;
      }
      case 'date': input = `<input class="input" type="date" ${common} value="${esc(v)}">`; break;
      case 'email': input = `<input class="input ltr" type="email" ${common}${ph} value="${esc(v)}" maxlength="${LIM.text}" dir="ltr">`; break;
      case 'url': input = `<input class="input ltr" type="url" ${common}${ph} value="${esc(v)}" maxlength="${LIM.url}" dir="ltr">`; break;
      // only the sender's own mobile is offered from the browser's autofill (the owner's is somebody else's number)
      case 'phone': input = `<div class="phone"><b>+971</b><input type="tel" ${common} inputmode="tel" autocomplete="${id === 'phone' ? 'tel-national' : 'off'}" placeholder="5X XXX XXXX" value="${esc(v)}" maxlength="20"></div>`; break;
      case 'gate': return `<div class="field full" data-f="${esc(id)}"><label class="gate"><input type="checkbox" ${common}${v === 'Yes' ? ' checked' : ''}><span>${esc(lbl)} ${reqMark}</span></label>${help}${err}</div>`;
      case 'list': return `<div class="field full" data-f="${esc(id)}"><div class="lbl" id="l_${esc(id)}">${esc(lbl)} ${reqMark}</div>${helpTop}<div class="list" role="group" aria-labelledby="l_${esc(id)}" data-list="${esc(id)}">${listRows(f)}</div>${help}${err}</div>`;
      case 'file': {
        const max = f.max || 3;
        return `<div class="field full" data-f="${esc(id)}"><div class="lbl" id="l_${esc(id)}">${esc(lbl)} ${reqMark}</div>${helpTop}
          <label class="drop" data-drop="${esc(id)}"><span class="ic">${icon('upload')}</span><span><b>${esc(t('dropT'))}</b><span>${esc(t('dropS', { files: counted('file', max) }))}</span></span>
          <input type="file" accept="application/pdf,.pdf" ${max > 1 ? 'multiple' : ''} data-file="${esc(id)}" aria-labelledby="l_${esc(id)}" aria-describedby="${described}"></label>
          <div class="files" data-files="${esc(id)}" aria-live="polite">${filesHtml(id)}</div>${help}${err}</div>`;
      }
      default: input = `<input class="input" type="text" ${common}${ph} value="${esc(v)}" maxlength="${LIM.text}">`;
    }
    return `<div class="field${full ? ' full' : ''}" data-f="${esc(id)}"><div class="lblrow"><label for="f_${esc(id)}">${esc(lbl)} ${reqMark}</label>${q}</div>${helpTop}${input}${info}${help}${err}</div>`;
  }

  function listRows(f) {
    let rows = S.v[f.id];
    if (!Array.isArray(rows) || !rows.length) { rows = S.v[f.id] = Array.from({ length: Math.max(1, f.min || 1) }, () => ({})); }
    const max = f.max || 5;
    const html = rows.map((r, i) => `<div class="row"><div class="hd"><span class="n">${esc(t('row', { n: i + 1 }))}</span>` +
      (rows.length > Math.max(1, f.min || 0) ? `<button type="button" class="btn sm ghost danger" data-del="${esc(f.id)}" data-row="${i}">${icon('trash', 'sm')}${esc(t('remove'))}</button>` : '') + `</div>` +
      `<div class="cells" data-cols="${esc(f.cols.map(c => c.w || '1fr').join(' '))}">${f.cols.map(c => `<div><label for="l_${esc(f.id)}_${i}_${esc(c.id)}">${esc(L(c))}${c.req ? ' *' : ''}</label>` +
        `<input class="input" id="l_${esc(f.id)}_${i}_${esc(c.id)}" data-li="${esc(f.id)}" data-row="${i}" data-col="${esc(c.id)}" aria-describedby="e_${esc(f.id)}"${c.inputmode ? ` inputmode="${esc(c.inputmode)}"` : ''} maxlength="${LIM.cell}" value="${esc(r[c.id] || '')}"></div>`).join('')}</div></div>`).join('');
    return html + (rows.length < max ? `<div><button type="button" class="btn sm" data-add="${esc(f.id)}">${icon('plus', 'sm')}${esc(t('add'))}</button></div>` : '');
  }

  const sizeTxt = n => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  function fileList(id) {
    if (id === 'momFiles') {
      if (!S.st) return [];
      S.st.momDraft = S.st.momDraft || {text:'',files:[]};
      return S.st.momDraft.files;
    }
    return S.files[id] = S.files[id] || [];
  }
  function filesHtml(id) {
    return fileList(id).map((x, i) => {
      const st = x.status === 'done' ? `${sizeTxt(x.size)} · ${t('uploaded')}` : x.status === 'error' ? x.error : x.status === 'checking' ? t('checking') : t('uploading');
      return `<div class="file ${x.status === 'done' ? 'ok' : x.status === 'error' ? 'bad' : ''}"><span class="pdf" aria-hidden="true">PDF</span><span class="nm"><b>${esc(x.name)}</b><span>${esc(st)}</span>` +
        (x.status === 'uploading' || x.status === 'checking' ? '<div class="bar"></div>' : '') + `</span>` +
        (x.status === 'done' || x.status === 'error' ? `<button type="button" class="icon-btn btn sm ghost" data-rmfile="${esc(id)}" data-i="${i}" aria-label="${esc(t('removeFile') + ': ' + x.name)}">${icon('x', 'sm')}</button>` : '') + `</div>`;
    }).join('');
  }

  /* visibility, required marks, option hints and blocks — refreshed after every change */
  function applyVis() {
    const c = cur(); if (!c) return;
    const m = model(S.step === 1 ? null : c), v = m.values();
    if (S.step === 2) {
      c.sections.forEach((sec, si) => { const el = $(`[data-sec="${si}"]`); if (el) el.classList.toggle('hidden', !m.test(sec.when)); });
      for (const [id, e] of m.fmap) { const el = $(`[data-f="${CSS.escape(id)}"]`); if (el) el.classList.toggle('hidden', !m.on(id)); }
      const bl = m.blocks();
      const bz = $('[data-blocks]');
      const key = bl.map(b => c.blocks.indexOf(b)).join(',');
      if (bz && bz.getAttribute('data-k') !== key) {   // (re-written only when it changes, so it is announced once)
        bz.setAttribute('data-k', key);
        bz.innerHTML = bl.map(b => `<div class="note bad" role="alert">${trusted(L(b))}${b.ax ? `<div class="nbtns"><button type="button" class="btn btn-s" data-annex="${esc(b.ax)}">${icon('book', 'sm')}${esc(t('annexOpen'))}</button></div>` : ''}</div>`).join('');
      }
      // Continue stays enabled: pressing it says why the request cannot be sent, and shows the notice
    }
    const all = S.step === 1 ? senderSecs().flatMap(s => s.fields) : [...m.fmap.values()].map(e => e.f);
    for (const f of all) {
      const need = m.reqOf(f, v);
      const mk = $(`[data-reqmark="${CSS.escape(f.id)}"]`);
      if (mk) mk.classList.toggle('hidden', !need);
      const inp = $(`[data-in="${CSS.escape(f.id)}"], [data-file="${CSS.escape(f.id)}"]`);
      if (inp && f.type !== 'gate') inp.setAttribute('aria-required', String(need));
    }
  }

  function afterRender() {
    $$('[data-cols]').forEach(el => el.style.setProperty('--cols', el.getAttribute('data-cols')));
    applyVis();
    if ($('[data-tpl]')) loadTemplates();
  }

  /* ---------------- templates (published by the admins from Admin Ledger) ---------------- */
  // The event template is only the department's own file, published by the admins from Admin Ledger (no form is bundled).
  function tplBox(name, showAnnex = true) {
    const T = PORTAL.TEMPLATES[name] || { en: name, ar: name };
    return `<div class="tplbox" data-tpl="${esc(name)}"><span class="ic">${icon('file')}</span><div class="tx"><b>${esc(L(T))}</b><span data-tplinfo>${esc(t('tplLoading'))}</span></div>` +
      `<div class="bt"><button type="button" class="btn sm hidden" data-tpldl="${esc(name)}">${icon('download', 'sm')}${esc(name === 'event' ? L(GUIDE.published) : t('tplDl'))}</button>` +
      `<button type="button" class="btn sm hidden" data-tplretry>${icon('refresh', 'sm')}${esc(t('tplRetry'))}</button>` +
      (showAnnex && T.annex ? `<button type="button" class="btn sm" data-annex="${esc(T.annex)}">${icon('book', 'sm')}${esc(t('annexOpen'))}</button>` : '') + '</div></div>';
  }
  async function loadTemplates(force) {
    if (force || !S.tpl || Date.now() - S.tplAt > 5 * 60000) {
      try {
        const res = await api({ action: 'templates' }, 20000);
        if (!res.ok) throw new Error(res.error || 'templates');
        S.tpl = {}; S.tplAt = Date.now(); S.tplFail = false;
        (Array.isArray(res.templates) ? res.templates : []).forEach(x => { if (x && x.name) S.tpl[x.name] = x; });
      } catch (e) { S.tpl = null; S.tplFail = true; }
    }
    $$('[data-tpl]').forEach(box => {
      const x = S.tpl && S.tpl[box.getAttribute('data-tpl')];
      const info = box.querySelector('[data-tplinfo]'), btn = box.querySelector('[data-tpldl]'), retry = box.querySelector('[data-tplretry]');
      if (x && x.version) { info.textContent = t('tplVer', { v: x.version, date: fmt(x.updated, { time: false }) }) + ' · ' + sizeTxt(x.size || 0); btn.classList.remove('hidden'); retry.classList.add('hidden'); }
      else if (S.tplFail) { info.textContent = t('tplListErr'); btn.classList.add('hidden'); retry.classList.remove('hidden'); }
      else { info.textContent = t('tplNone'); btn.classList.add('hidden'); retry.classList.add('hidden'); }
    });
  }
  /* A downloaded template is kept in memory for this page session: another click saves it again without asking the
     service (whose downloads are limited) — unless the department has published a newer version since. */
  async function downloadTemplate(name, btn) {
    const kept = S.tplFiles[name], known = S.tpl && S.tpl[name];
    if (kept && !kept.bundled && !(known && known.version && known.version !== kept.version)) { saveBlob(kept.blob, kept.fileName); return; }
    const label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(t('tplDownloading'))}`;
    try {
      const res = await api({ action: 'template', name }, 120000);
      if (!res.ok || !res.b64) { const e = new Error(res.error || 'nofile'); e.tpl = res.error; throw e; }
      const bin = atob(res.b64), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const blob = new Blob([u], { type: res.mime || 'application/octet-stream' });
      const fileName = String(res.fileName || (name + '-template')).replace(/[\\/:*?"<>|]+/g, '_');
      S.tplFiles[name] = { version: res.version, blob, fileName };
      saveBlob(blob, fileName);
      if (S.tpl && res.version) S.tpl[name] = { ...(S.tpl[name] || {}), version: res.version, updated: res.updated, size: res.size, fileName: res.fileName };
    } catch (e) { toast(e && e.code ? errText(e) : e && e.tpl === 'busy' ? t('tplBusy') : t('tplErr')); }
    if (D.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; }
  }
  function saveBlob(blob, fileName) {
    const a = D.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
    D.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function showErr(id, msg) {
    const fe = $(`[data-f="${CSS.escape(id)}"]`); const ee = $(`[data-err="${CSS.escape(id)}"]`);
    if (fe) fe.classList.toggle('bad', !!msg);
    if (ee) ee.textContent = msg || '';
    const inp = fe ? fe.querySelector('[data-in], [data-file], [data-li], input, select, textarea') : null;
    if (inp) { if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); }
  }
  function focusField(id) {
    const first = $(`[data-f="${CSS.escape(id)}"]`);
    if (!first) return;
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const inp = first.querySelector('input:not([type="hidden"]),select,textarea');
    if (inp) setTimeout(() => inp.focus({ preventScroll: true }), 300);
  }

  function validateStep(step) {
    const c = cur();
    const errs = [];
    if (step === 1) {
      const m = model(null), v = m.values();
      for (const sec of senderSecs()) for (const f of sec.fields) { const e = checkField(f, m, v); showErr(f.id, e); if (e) errs.push(f.id); }
    } else if (step === 2) {
      const m = model(c), v = m.values();
      for (const [id, e] of m.fmap) { if (!m.on(id)) { showErr(id, null); continue; } const er = checkField(e.f, m, v); showErr(id, er); if (er) errs.push(id); }
      if (m.blocks().length) errs.push('_block');
    }
    if (!errs.length) return true;
    if (errs.includes('_block')) {   // a notice stops this request: say so, and bring the notice into view
      toast(t('blocked'));
      const bz = $('[data-blocks]');
      if (bz) { bz.scrollIntoView({ behavior: 'smooth', block: 'center' }); bz.setAttribute('tabindex', '-1'); setTimeout(() => bz.focus({ preventScroll: true }), 300); }
      return false;
    }
    toast(t('fix'));
    focusField(errs[0]);
    return false;
  }

  /* ---------------- review ---------------- */
  function displayValue(f, val) {
    if (f.type === 'topics') return val.map(r => esc(optLabel(f, r.topic)) + ' — ' + esc(r.type)).join('<br>');
    if (f.type === 'select' || f.type === 'cards') return esc(optLabel(f, val));
    if (f.type === 'gate') return val === 'Yes' ? `${icon('check', 'sm')} ${esc(t('yes'))}` : '';
    if (f.type === 'date') return esc(fmtDay(val));
    if (f.type === 'phone') return `<span class="ltr">${esc(normPhone(val) || val)}</span>`;
    if (f.type === 'url' || f.type === 'email') return `<span class="ltr">${esc(val)}</span>`;
    if (f.type === 'list') return (val || []).filter(r => f.cols.some(c => String(r[c.id] || '').trim())).map((r, i) => `<span class="sub">${i + 1}. <bdi>${f.cols.map(c => esc(r[c.id] || '')).filter(Boolean).join(' · ')}</bdi></span>`).join('');
    return esc(val).replace(/\n/g, '<br>');
  }
  function stepReview(c) {
    const m = model(c), v = m.values();
    const rows = (sec, fields, isSender) => fields.filter(f => f.id && f.type !== 'note' && (isSender || m.on(f.id))).map(f => {
      if (f.type === 'file') { const fl = (S.files[f.id] || []).filter(x => x.status === 'done'); return fl.length ? `<div class="k">${esc(L(f))}</div><div>${fl.map(x => `<span class="sub"><bdi>${esc(x.name)}</bdi> · ${sizeTxt(x.size)}</span>`).join('')}</div>` : ''; }
      const val = S.v[f.id];
      if (val == null || val === '' || (Array.isArray(val) && !val.some(r => Object.values(r).some(x => String(x || '').trim())))) return '';
      // a value is isolated (bdi): an English name in the Arabic page keeps its full stop at its end, and the other way round
      return `<div class="k">${esc(L(f))}</div><div>${f.type === 'list' ? displayValue(f, val) : '<bdi>' + displayValue(f, val) + '</bdi>'}</div>`;
    }).join('');
    const sender = senderSecs().map(sec => `<div class="kv-h">${esc(L(sec))}</div><div class="kv">${rows(sec, sec.fields, true)}</div>`).join('');
    const reqd = c.sections.filter(sec => m.test(sec.when)).map(sec => { const r = rows(sec, sec.fields, false); return r ? `<div class="kv-h">${esc(L(sec))}</div><div class="kv">${r}</div>` : ''; }).join('');
    const hasLink = Object.keys(S.v).some(k => /oneDrive/i.test(k) && m.on(k) && String(S.v[k] || '').trim());
    const decls = c.declOnly ? PORTAL.DECL.filter(d => d && c.declOnly.includes(d.id))
      : [...PORTAL.DECL.filter(d => d && (!d.whenLink || hasLink)), ...(c.decl || [])];
    const team = PORTAL.teamOf(c);
    return `<div class="panel"><h2 data-focus>${esc(t('steps')[2])}</h2><p class="desc">${esc(t('s3sub'))}</p>
      <div class="kv"><div class="k">${esc(t('rvService'))}</div><div><b>${esc(L(c))}</b></div><div class="k">${esc(t('rvTeam'))}</div><div>${esc(L(team))}</div></div>
      ${sender}${reqd}
      <div class="kv-h">${esc(t('declH'))}</div>
      <div class="decl" data-decls>${decls.map(d => `<label class="check"><input type="checkbox" data-decl="${esc(d.id)}"${S.decl[d.id] ? ' checked' : ''}><span>${esc(L(d))}</span></label>`).join('')}</div>
      <div class="navrow"><button type="button" class="btn sm ghost" data-act="checkall">${icon('check', 'sm')}${esc(t('checkAll'))}</button></div>
      <div class="navrow"><button type="button" class="btn" data-act="back">${icon('back', 'sm flip')}${esc(t('back'))}</button>${guideLink(c.id, 'step')}
        <div class="end"><button type="button" class="btn primary lg" data-act="submit">${icon('shield', 'sm')}${esc(t('submit'))}</button></div></div></div>`;
  }

  /* ---------------- the service ---------------- */
  const WITH_SID = ['upload', 'submit'];   // the calls the service counts per page session
  async function api(body, ms = 60000) {
    if (!CFG.endpoint) { const e = new Error('noservice'); e.code = 'noservice'; throw e; }
    const send = WITH_SID.includes(body.action) ? { ...body, sid: SID } : body;
    const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch(CFG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(send),
        credentials: 'omit', cache: 'no-store', redirect: 'follow', referrerPolicy: 'no-referrer', signal: ac.signal });
      if (!r.ok) { const e = new Error('http ' + r.status); e.code = 'net'; throw e; }
      const j = await r.json();
      if (!j || typeof j !== 'object') { const e = new Error('bad answer'); e.code = 'net'; throw e; }
      return j;
    } catch (e) { if (e.code) throw e; const x = new Error('net'); x.code = 'net'; throw x; }
    finally { clearTimeout(tm); }
  }
  const errText = e => (e && e.code === 'noservice' ? t('noService') : t('netErr'));

  function buildPayload() {
    const c = cur(), m = model(c);
    const form = {}, files = [];
    for (const [id, e] of m.fmap) {
      const f = e.f;
      if (!m.on(id) || f.type === 'note') continue;
      if (f.type === 'file') { (S.files[id] || []).filter(x => x.status === 'done').forEach(x => files.push({ fileId: x.fileId, field: id })); continue; }
      const val = S.v[id];
      if (f.type === 'topics') {
        form.topicTypes = (val || []).map(r => ({topic:r.topic, type:r.type.trim()}));
      } else if (f.type === 'list') {
        const rows = (Array.isArray(val) ? val : []).map(r => { const o = {}; f.cols.forEach(cc => { const x = String(r[cc.id] || '').trim(); if (x) o[cc.id] = NUMERIC.test(cc.inputmode || '') ? asciiDigits(x) : x; }); return o; }).filter(o => Object.keys(o).length);
        if (rows.length) form[id] = rows;
      } else if (val != null && String(val).trim() !== '') {
        const s = f.normalise ? f.normalise(val) : String(val).trim();
        form[id] = f.type === 'phone' ? (normPhone(val) || s) : NUMERIC.test(f.inputmode || '') ? asciiDigits(s) : s;
      }
    }
    if (c.id === 'event') form.evOrganizer = String(S.v.company || '').trim();   // the organiser is the sender (Events register column)
    const sender = { by: c.id === 'event' ? 'Organizer' : (S.v.role || ''), company: String(S.v.company || '').trim(), person: String(S.v.name || '').trim(), mobile: normPhone(S.v.phone) || '', email: String(S.v.email || '').trim().toLowerCase(), ...(String(S.v.licence || '').trim() ? { licence: String(S.v.licence).trim() } : {}) };
    if (c.code === 'SA') {
      sender.by = ''; sender.person = ''; sender.email = '';
      if (String(S.v.companyNumber || '').trim()) form.companyNumber = S.v.companyNumber.trim();
    }
    if (c.code === 'FC') sender.by = 'Consultant';
    if (c.code === 'TP') sender.person = '';
    const owner = (['event', 'hq', 'facade', 'temporary'].includes(c.id)) ? {} : { name: String(S.v.ownerName || '').trim(), mobile: normPhone(S.v.ownerPhone) || '', email: String(S.v.ownerEmail || '').trim().toLowerCase() };
    if (c.id === 'hq' && form.hqStaff) form.hqStaff = asciiDigits(form.hqStaff).replace(/[\s-]+/g, '');
    const engineer = form.engineer || form.statusEng || form.portalEng || '';
    // the template version this client downloaded during this visit — not known when it was downloaded another time
    const tv = c.tplName && S.tplFiles[c.tplName] ? S.tplFiles[c.tplName].version || null : null;
    return { action: 'submit', lang, code: c.code, sender, owner, engineer, form, files, ...(c.tplName ? { templateVersion: tv } : {}), token: S.token, hp: S.hp, t: Date.now() - S.t0 };
  }

  /* uploads the service no longer keeps (2 h): marked, so the client uploads them again */
  function markRedo(test) {
    let any = false;
    for (const id of Object.keys(S.files)) for (const x of S.files[id]) if (x.status === 'done' && test(x)) { x.status = 'error'; x.error = t('fRedo'); any = true; }
    return any;
  }
  function backToFiles() {
    S.step = 2; render();
    const id = Object.keys(S.files).find(k => S.files[k].some(x => x.status === 'error'));
    if (id) { showErr(id, t('fRedo')); focusField(id); }
  }

  function renderPending() {
    app.innerHTML = `<div class="wrap page"><div class="panel">
      <h1 data-focus>${esc(L(catById(S.cat)))}</h1>
      <p role="status">${esc(t(S.busy ? 'submitting' : 'pendingSend'))}</p>
      <button type="button" class="btn primary" data-act="submit"${S.busy ? ' disabled' : ''}>${esc(t('retrySend'))}</button>
    </div></div>`;
  }

  async function submit(extra = {}) {
    if (S.busy) return;
    if (!S.pending) {
      const boxes = $$('[data-decl]');
      if (boxes.some(b => !b.checked)) { toast(t('declErr')); boxes.find(b => !b.checked).focus(); return; }
      if (markRedo(x => Date.now() - (x.at || 0) > UPLOAD_FRESH_MS)) { toast(t('badFile')); backToFiles(); return; }
      S.pending = { ...buildPayload(), ...extra };
    }
    const retry = S.ambiguous;
    S.busy = true;
    render();
    let res;
    try { res = await api(S.pending); }
    catch (e) { if (e.code === 'noservice') res = { ok: false, error: 'noservice' }; }
    S.busy = false;
    if (res?.ok === true) {
      S.pending = null; S.ambiguous = false;
      S.receipt = true;
      S.v = {}; S.files = {}; S.decl = {}; S.step = 1; S.t0 = Date.now(); S.token = newToken();
      history.replaceState(null, '', location.pathname + location.search);
      render();
      return;
    }
    const rejected = res?.ok === false &&
      ['duplicate', 'retry_changed', 'recent', 'invalid', 'limit', 'paused', 'bot', 'badfile', 'closed', 'noservice'].includes(res.error);
    if (!rejected || (retry && res.error === 'paused')) {
      S.ambiguous = true;
      render();
      return;
    }
    const code = S.pending.code;
    S.pending = null; S.ambiguous = false; S.token = newToken();
    render();
    handleSubmitError(res, extra, code);
  }
  async function handleSubmitError(res, extra = {}, code = '') {
    const e = res.error;
    if (e === 'duplicate' || e === 'retry_changed') {
      await dialog({ icon: 'alert', title: t('dupH'), text: t(code === 'EV' ? 'eventCorrection' : e === 'retry_changed' ? 'changedSend' : 'dupP'),
        buttons: [{ k: 'close', label: t('close'), cls: 'primary' }] });
    } else if (e === 'recent') {
      const answer = await dialog({ icon: 'alert', title: t('recH'), text: t('recP'),
        buttons: [{ k: 'cancel', label: t('cancel') }, { k: 'keep', label: t('recKeep'), cls: 'primary' }] });
      if (answer === 'keep') submit({ ...extra, allowRecent: true });
    } else if (e === 'invalid') {
      toast(t('serverInvalid'));
      const fields = Array.isArray(res.fields) ? res.fields : [];
      const senderIds = new Set(senderSecs().flatMap(s => s.fields.map(f => f.id)));
      const map = { company: 'company', person: 'name', mobile: 'phone', email: 'email', 'owner.name': 'ownerName', 'owner.mobile': 'ownerPhone', 'owner.email': 'ownerEmail',
        'sender.licence':'licence', 'sender.company': 'company', 'sender.person': 'name', 'sender.mobile': 'phone', 'sender.email': 'email', 'sender.by': 'role' };
      const ids = fields.map(x => map[x] || String(x).replace(/^(?:form|files)\./, ''));
      S.step = ids.some(id => senderIds.has(id)) ? 1 : 2; render();
      ids.forEach(id => showErr(id, t('invalid')));
      if (ids.length) focusField(ids[0]);
    } else if (e === 'noservice') toast(t('noService'));
    else if (e === 'limit') toast(t('limit'));
    else if (e === 'paused') pausedNotice();
    else if (e === 'bot') toast(t('botErr'));
    else if (e === 'badfile') {
      const bad = new Set(Array.isArray(res.badFiles) ? res.badFiles : []);
      markRedo(x => !bad.size || bad.has(x.fileId));
      toast(t('badFile'));
      backToFiles();
    } else toast(t('netErr'));
  }

  const pausedNotice = () => dialog({ icon: 'alert', title: t('pausedH'), text: t('paused'),
    buttons: [{ k: 'close', label: t('close'), cls: 'primary' }] });

  /* ---------------- uploads ---------------- */
  /* a first look in the browser (the service and the portal link are the real checks): the long names only — the three
     bytes "/JS" occur by chance inside the compressed data of big drawings */
  const ACTIVE_RE = /\/(?:JavaScript|Launch|EmbeddedFiles?|RichMedia)(?=[\s/<(\[>]|$)/;
  const ENCRYPT_RE = /\/Encrypt(?=[\s/<(\[>]|$)/;
  const latin1 = buf => { const u = new Uint8Array(buf); let s = ''; const CH = 0x8000; for (let i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH)); return s; };
  const toB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).replace(/^data:[^,]*,/, '')); r.onerror = () => rej(r.error); r.readAsDataURL(file); });

  async function addFiles(id, list) {
    const c = cur(); const e = id === 'momFiles' ? {f:{max:3}} : model(c).fmap.get(id); if (!e) return;
    const f = e.f, max = f.max || 3;
    const orLink = f.od ? t('fOrLink') : '';   // only where a OneDrive link can be given instead
    const bucket = fileList(id);
    for (const file of Array.from(list)) {
      const live = bucket.filter(x => x.status !== 'error');
      if (live.length >= max) { toast(t('fMax', { files: counted('file', max) })); break; }
      const x = { name: file.name, size: file.size, status: 'checking' };
      bucket.push(x); paintFiles(id);
      try {
        if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') throw t('fNotPdf');
        if (file.size > MAX_FILE) throw f.od ? t('fTooBig') : t('fTooBigNoLink');
        const buf = await file.arrayBuffer();
        const all = latin1(buf);
        if (!/%PDF-/.test(all.slice(0, 1024))) throw t('fNotPdf');
        const names = all.replace(/#([0-9A-Fa-f]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
        if (ENCRYPT_RE.test(names)) throw t('fEncrypted');
        if (ACTIVE_RE.test(names)) throw t('fActive');
        x.status = 'uploading'; paintFiles(id);
        const res = await api({ action: 'upload', name: file.name, size: file.size, b64: await toB64(file), field: id }, 240000);
        if (res.ok) { x.status = 'done'; x.fileId = res.fileId; x.at = Date.now(); }
        else if (res.error === 'busy' && res.scope === 'session') throw t('fBusySession', { mins: counted('minute', res.retryAfterMin || 60) }) + orLink;
        else throw ({ notpdf: t('fNotPdf'), toobig: f.od ? t('fTooBig') : t('fTooBigNoLink'), active: t('fActive'), encrypted: t('fEncrypted'), busy: t('fBusy') + orLink, paused: t('fPaused') }[res.error] || t('fFail'));
      } catch (err) { x.status = 'error'; x.error = typeof err === 'string' ? err : errText(err); }
      paintFiles(id);
    }
  }
  function paintFiles(id) {
    const z = $(`[data-files="${CSS.escape(id)}"]`); if (z) z.innerHTML = filesHtml(id);
    showErr(id, null); if (id !== 'momFiles') applyVis();
  }

  function renderReceipt() {
    app.innerHTML = '<div class="wrap page"><div class="panel receipt"><h1 data-receipt>' +
      esc(t('rcP')) + '</h1></div></div>';
  }

  function dialog({ icon: ic, title, text, body = '', buttons, wide }) {
    return new Promise(resolve0 => {
      if (dlg.open) { dlg.close(); if (dlgCancel) dlgCancel(); }
      const resolve = (v) => { dlgCancel = null; resolve0(v); };
      dlgCancel = () => resolve('cancel');
      dlg.className = wide ? 'wide' : '';
      dlg.innerHTML = `<div class="dh">${ic ? `<span class="ic">${icon(ic)}</span>` : ''}<div><h2 id="dlgT">${esc(title)}</h2>${text ? `<p id="dlgD">${esc(text)}</p>` : ''}</div></div>` +
        (body ? `<div class="db">${body}</div>` : '') + `<div class="df">${buttons.map(b => `<button type="button" class="btn ${b.cls || ''}" data-dk="${esc(b.k)}">${esc(b.label)}</button>`).join('')}</div>`;
      dlg.setAttribute('aria-labelledby', 'dlgT');
      if (text) dlg.setAttribute('aria-describedby', 'dlgD'); else dlg.removeAttribute('aria-describedby');
      dlg.onclick = ev => {
        const button = ev.target.closest('[data-dk]');
        if (button) { dlg.close(); resolve(button.getAttribute('data-dk')); }
      };
      dlg.oncancel = dlgCancel;
      dlg.showModal();
    });
  }
  function openAnnex(topic) {
    const A = (typeof ANNEX !== 'undefined' && ANNEX[lang]) || null; if (!A) return;
    const tp = A.topics.find(x => x.id === topic); if (!tp) return;
    const item = it => (typeof it === 'string' ? esc(it) : `<span class="sw" data-sw="${esc(it.c)}"></span>${esc(it.s)}`);
    const body = `<p class="muted mt0">${esc(tp.sub || '')} · <b>${esc(tp.ref || '')}</b></p>` +
      tp.groups.map(g => `<div class="ax-g"><h4>${esc(g.h)}</h4><ul>${g.items.map(it => `<li>${item(it)}</li>`).join('')}</ul></div>`).join('') +
      `<p class="faint fs12 mt14">${esc(A.src)}</p><p><a href="${esc(FLS_LINK)}" target="_blank" rel="noopener noreferrer">${esc(A.open)}</a></p>`;
    dialog({ icon: 'book', title: tp.t, body, wide: true, buttons: [{ k: 'ok', label: t('close'), cls: 'primary' }] });
    $$('[data-sw]', dlg).forEach(el => { el.style.background = el.getAttribute('data-sw'); });
  }

  /* ---------------- events ---------------- */
  D.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act],[data-step],[data-add],[data-del],[data-rmfile],[data-q],[data-annex],[data-switch],[data-decl],[data-tpldl],[data-tplretry],[data-help-image]');
    if (!el) return;
    if (S.pending && !['lang', 'submit'].includes(el.getAttribute('data-act'))) return;
    if (el.hasAttribute('data-help-image')) {
      const img = el.querySelector('img');
      dialog({ title: L(GUIDE.enlarge), wide: true,
        body: `<div class="help-zoom" tabindex="0" aria-label="${esc(img.alt)}"><img src="${esc(img.src)}" alt="${esc(img.alt)}"></div>`,
        buttons: [{ k: 'ok', label: t('close'), cls: 'primary' }] });
      return;
    }
    if (el.hasAttribute('data-tpldl')) { downloadTemplate(el.getAttribute('data-tpldl'), el); return; }
    if (el.hasAttribute('data-tplretry')) { loadTemplates(true); return; }
    if (el.hasAttribute('data-annex')) { ev.preventDefault(); openAnnex(el.getAttribute('data-annex')); return; }
    if (el.hasAttribute('data-switch')) { ev.preventDefault(); const to = el.getAttribute('data-switch'); S.cat = null; go('#/new/' + to); return; }
    if (el.hasAttribute('data-decl')) { S.decl[el.getAttribute('data-decl')] = el.checked; return; }
    if (el.hasAttribute('data-q')) { const id = el.getAttribute('data-q'); const box = $(`[data-info="${CSS.escape(id)}"]`); if (box) { box.classList.toggle('hidden'); el.setAttribute('aria-expanded', String(!box.classList.contains('hidden'))); } return; }
    if (el.hasAttribute('data-step')) { S.step = +el.getAttribute('data-step'); render(); return; }
    if (el.hasAttribute('data-add')) { const id = el.getAttribute('data-add'); (S.v[id] = S.v[id] || []).push({}); const f = model(cur()).fmap.get(id); if (f) { $(`[data-list="${CSS.escape(id)}"]`).innerHTML = listRows(f.f); afterRender(); } return; }
    if (el.hasAttribute('data-del')) { const id = el.getAttribute('data-del'); S.v[id].splice(+el.getAttribute('data-row'), 1); const f = model(cur()).fmap.get(id); if (f) { $(`[data-list="${CSS.escape(id)}"]`).innerHTML = listRows(f.f); afterRender(); } return; }
    if (el.hasAttribute('data-rmfile')) { const id = el.getAttribute('data-rmfile'); fileList(id).splice(+el.getAttribute('data-i'), 1); paintFiles(id); return; }
    const a = el.getAttribute('data-act');
    if (a === 'lang') { lang = lang === 'ar' ? 'en' : 'ar'; const u = new URL(location.href); if (lang === 'ar') u.searchParams.set('lang', 'ar'); else u.searchParams.delete('lang'); history.replaceState(null, '', u.pathname + u.search + u.hash); focusAfter = '[data-act="lang"]'; render(); }
    else if (a === 'next') { if (validateStep(S.step)) { S.step = Math.min(3, S.step + 1); render(); } }
    else if (a === 'back') { S.step = Math.max(1, S.step - 1); render(); }
    else if (a === 'checkall') { $$('[data-decl]').forEach(b => { b.checked = true; S.decl[b.getAttribute('data-decl')] = true; }); }
    else if (a === 'submit') submit();
    else if (a === 'form') go('#/new/' + route().arg);
  });
  D.addEventListener('input', ev => {
    if (S.pending) return;
    const el = ev.target;
    if (el.hasAttribute('data-hp')) { S.hp = el.value; return; }
    const id = el.getAttribute('data-in');
    if (id) { S.v[id] = el.type === 'checkbox' ? (el.checked ? 'Yes' : '') : el.value; showErr(id, null); applyVis(); return; }
    if (el.hasAttribute('data-topic-type')) {
      const row = S.v.topicTypes.find(r => r.topic === el.dataset.topicType);
      if (row) row.type = el.value;
      showErr('topicTypes', null);
    }
    const li = el.getAttribute('data-li');
    if (li) { const rows = S.v[li] = S.v[li] || []; const r = +el.getAttribute('data-row'); rows[r] = rows[r] || {}; rows[r][el.getAttribute('data-col')] = el.value; showErr(li, null); }
  });
  D.addEventListener('change', ev => {
    if (S.pending) return;
    const el = ev.target;
    if (el.hasAttribute('data-topic')) {
      const topic = el.dataset.topic;
      const rows = (S.v.topicTypes || []).filter(r => r.topic !== topic);
      if (el.checked) rows.push({topic, type:''});
      S.v.topicTypes = rows;
      const label = D.getElementById(el.getAttribute('aria-controls'));
      label.classList.toggle('hidden', !el.checked);
      label.querySelector('input').value = '';
      showErr('topicTypes', null);
      return;
    }
    const id = el.getAttribute('data-in');
    if (id) {
      S.v[id] = el.type === 'checkbox' ? (el.checked ? 'Yes' : '') : el.value; showErr(id, null);
      const oh = $(`[data-ohint="${CSS.escape(id)}"]`);
      if (oh) { const e = (model(cur()).fmap.get(id) || {}).f || senderSecs().flatMap(s => s.fields).find(f => f.id === id); const h = e ? optHint(e, el.value) : ''; oh.textContent = h; oh.classList.toggle('hidden', !h); }
      if (el.type === 'tel') { const n = normPhone(el.value); if (n) { el.value = n.replace(/^\+971 /, ''); S.v[id] = el.value; } }
      applyVis();
    }
    const fid = el.getAttribute('data-file');
    if (fid && el.files && el.files.length) { addFiles(fid, el.files); el.value = ''; }
  });
  ['dragenter', 'dragover'].forEach(n => D.addEventListener(n, ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) { ev.preventDefault(); z.classList.add('over'); } }));
  ['dragleave', 'drop'].forEach(n => D.addEventListener(n, ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) { ev.preventDefault(); z.classList.remove('over'); if (n === 'drop' && ev.dataTransfer && ev.dataTransfer.files.length) addFiles(z.getAttribute('data-drop'), ev.dataTransfer.files); } }));
  window.addEventListener('hashchange', render);
  /* for the end-to-end test only, and only on the dev server (PORTAL_CONFIG.dev): a read-only view of where the page is.
     The published site has no such hook. */
  if (CFG.dev === true) {
    window.__portal = { state: () => ({ cat: S.cat, step: S.step, lang, receipt: S.receipt }) };
  }
  render();
})();
</script>
